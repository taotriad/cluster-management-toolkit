---
operator-sdk:
  description: "operator-sdk"
  installed_version:
    function: "get_executable_version"
    executable: "/usr/bin/operator-sdk"
    args: ["version"]
    version_regex: '^operator-sdk version: "v(\d+)(\.)(\d+)(\.)(\d+)" .*'
  candidate_version:
    function: "get_github_version"
    args:
      # yamllint disable-line rule:line-length
      url: "https://api.github.com/repos/operator-framework/operator-sdk/releases?per_page=100"
      version_regex: 'v(\d+)(\.)(\d+)(\.)(\d+)$'
  changelog:
    from_body: true
    dest: "operator-sdk_changelog.md"
