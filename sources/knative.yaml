---
knative:
  description: "Knative"
  installed_version:
    function: "get_executable_version"
    executable: "/usr/bin/kn"
    args: ["version", "-o", "yaml"]
    version_regex: '^Version: v(.*)$'
  candidate_version:
    function: "get_github_version"
    args:
      url: "https://api.github.com/repos/knative/client/releases?per_page=100"
      version_regex: '^knative-v(.*)$'
  changelog:
    from_body: true
    dest: "knative_changelog.md"
