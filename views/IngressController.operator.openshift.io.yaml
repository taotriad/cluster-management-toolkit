---
kind: "IngressController"
api_family: "operator.openshift.io"
default_command: "ingresscontrollers"
listview:
  name: "Ingress Controllers"
  group: "OpenShift"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Ingress Controller Info"
  infopad:
    row_indexes:
      Wide:
        fields: ["domain",
                 "namespace_name_selector",
                 "namespace_selector",
                 "client_tls_header",
                 "client_tls_ca_name",
                 "client_tls_client_certificate_policy",
                 "http_empty_requests_policy",
                 "endpoint_publishing_strategy",
                 "tls_ciphers",
                 "min_tls_version",
                 "desired_replicas",
                 "available_replicas"]
      Normal:
        fields: ["domain",
                 "namespace_name_selector",
                 "namespace_selector",
                 "client_tls_header",
                 "client_tls_ca_name",
                 "client_tls_client_certificate_policy",
                 "http_empty_requests_policy",
                 "endpoint_publishing_strategy",
                 "tls_ciphers_ellipsise",
                 "min_tls_version",
                 "desired_replicas",
                 "available_replicas"]
    rows:
      available_replicas:
        header: [["Available Replicas:", ["main", "infoheader"]]]
        path: "status#availableReplicas"
        default: 0
        type: "int"
        formatter: "numerical"
      client_tls_header:
        header: [["Client TLS:", ["main", "infoheader"]]]
      client_tls_ca_name:
        header: [["  CA Name:", ["main", "infoheader"]]]
        path: "spec#clientTLS#name"
        default: "<unset>"
        type: "str"
      client_tls_client_certificate_policy:
        header: [["  Client Certificate Policy:", ["main", "infoheader"]]]
        path: "spec#clientCertificatePolicy"
        default: "<unset>"
        type: "str"
      desired_replicas:
        header: [["Desired Replicas:", ["main", "infoheader"]]]
        path: "spec#replicas"
        default: 0
        type: "int"
        formatter: "numerical"
      domain:
        header: [["Domain:", ["main", "infoheader"]]]
        path: "status#domain"
        type: "str"
      endpoint_publishing_strategy:
        header: [["Endpoint Publishing Strategy:", ["main", "infoheader"]]]
        path: "status#endpointPublishingStrategy#type"
        type: "str"
      http_empty_requests_policy:
        header: [["HTTP Empty Requests Policy:", ["main", "infoheader"]]]
        path: "spec#httpEmptyRequestsPolicy"
        default: "<unset>"
        type: "str"
      min_tls_version:
        header: [["Min TLS Version:", ["main", "infoheader"]]]
        path: "status#tlsProfile#minTLSVersion"
        default: "<unset>"
        type: "str"
        formatter: "version"
      namespace_name_selector:
        header: [["Namespace Name Selector:", ["main", "infoheader"]]]
        path: "spec#namespaceSelector#matchNames"
        default: ["<unset>"]
        type: "raw"
        formatter: "list"
      namespace_selector:
        header: [["Namespace Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#namespaceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      tls_ciphers:
        header: [["T", ["main", "infoheader_shortcut"]],
                 ["LS Ciphers:", ["main", "infoheader"]]]
        path: "status#tlsProfile#ciphers"
        default: "<unset>"
        type: "raw"
        formatter: "list"
      tls_ciphers_ellipsise:
        header: [["T", ["main", "infoheader_shortcut"]],
                 ["LS Ciphers:", ["main", "infoheader"]]]
        path: "status#tlsProfile#ciphers"
        default: "<unset>"
        type: "raw"
        formatter: "list"
        formatting:
          ellipsise: 3
  shortcuts:
    "Namespace Selector":
      key: "t"
      read_only: true
      helptext: "Show Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#namespaceSelector"
    "Show TLS cipher list":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "List TLS ciphers"
      widget: "windowwidget"
      widget_args:
        title: "TLS Ciphers:"
        itemgetter: "get_list_as_list"
        itemgetter_args:
          paths: ["status#tlsProfile#ciphers"]
        # Not supported for now
        sortcolumn: "cipher"
