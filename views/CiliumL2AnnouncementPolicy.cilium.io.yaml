---
kind: "CiliumL2AnnouncementPolicy"
api_family: "cilium.io"
default_command: "ciliuml2announcementpolicies"
command:
  - "l2announcements"
  - "l2announcement"
listview:
  name: "Cilium L2 Announcement Policies"
  group: "Cilium"
  field_indexes:
    Normal:
      fields: ["name", "age"]
infoview:
  name: "Cilium L2 Announcement Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["service_selector",
                 "node_selector",
                 "interfaces",
                 "external_ips",
                 "loadbalancer_ips"]
    rows:
      external_ips:
        header: [["External IPs:", ["main", "infoheader"]]]
        path: "spec#externalIPs"
        default: "<unset>"
        type: "bool"
      interfaces:
        header: [["Interfaces:", ["main", "infoheader"]]]
        path: "spec#interfaces"
        default: ["<none>"]
        type: "raw"
        formatter: "list"
      loadbalancer_ips:
        header: [["Loadbalancer IPs:", ["main", "infoheader"]]]
        path: "spec#externalIPs"
        default: "<unset>"
        type: "bool"
      node_selector:
        header: [["Node ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#nodeSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      service_selector:
        header: [["Service Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#serviceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  shortcuts:
    "Service Selector":
      key: "t"
      read_only: true
      helptext: "Show Service selector"
      widget: "windowwidget"
      widget_args:
        title: "Service Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#serviceSelector"
    "Node Selector":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Show Node selector"
      widget: "windowwidget"
      widget_args:
        title: "Node Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#nodeSelector"
