---
kind: "Driver"
api_family: "csi.ceph.io"
default_command: "drivers.csi.ceph.io"
command:
  - "cephdrivers"
  - "cephdriver"
  - "cephdrvs"
  - "cephdrv"
listview:
  name: "Drivers"
  group: "Storage & Backups"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "fs_client_type", "fs_group_policy", "age"]
      sortcolumn: "namespace"
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
  fields:
    fs_client_type:
      header: "Client Type:"
      path: "spec#cephFsClientType"
      default: "<none>"
      type: "str"
    fs_group_policy:
      header: "Group Policy:"
      path: "spec#fsGroupPolicy"
      default: "<unset>"
      type: "str"
infoview:
  name: "Driver Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["fs_client_type", "fs_group_policy",
                 "node_plugin_header", "node_plugin_update_strategy"]
    rows:
      fs_client_type:
        header: [["CephFS Client Type:", ["main", "infoheader"]]]
        path: "spec#cephFsClientType"
        default: "<none>"
        type: "str"
      fs_group_policy:
        header: [["FS Group Policy:", ["main", "infoheader"]]]
        path: "spec#fsGroupPolicy"
        default: "<unset>"
        type: "str"
      node_plugin_header:
        header: [["Node Plugin:", ["main", "infoheader"]]]
      node_plugin_update_strategy:
        header: [["  Update Strategy:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#nodePlugin#updateStrategy#type"],
                   " (", "Max Surge: ",
                   ["spec#nodePlugin#updateStrategy#rollingUpdate#maxSurge"],
                   "Max Unavailable: ",
                   # yamllint disable-line rule:line-length
                   ["spec#nodePlugin#updateStrategy#rollingUpdate#maxUnavailable"], ")"]
            pathtype: "tuple"
            when:
              - key: "spec#nodePlugin#updateStrategy#type"
                eq: "RollingUpdate"
            default: ["", "", "", "<unset>", "", "<unset>", ""]
        formatter: "list"
        formatting:
          field_colors:
            - type: "generic"
            - type: "generic"
            - context: "main"
              type: "infoheader"
            - type: "numerical"
            - context: "main"
              type: "infoheader"
            - type: "numerical"
            - type: "generic"
          field_separators:
            - type: "no_pad"
            - type: "no_pad"
            - type: "no_pad"
            - type: "list"
            - type: "no_pad"
            - type: "no_pad"
          field_formatters:
            - ""
            - ""
            - ""
            - "numerical_with_units"
            - ""
            - "numerical_with_units"
            - ""
