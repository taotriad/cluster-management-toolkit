---
kind: "KubeletConfig"
api_family: "machineconfiguration.openshift.io"
default_command: "kubeletconfigs"
listview:
  name: "Kubelet Configs"
  group: "OpenShift"
  field_indexes:
    Normal:
      fields: ["name", "age"]
infoview:
  name: "Kubelet Config Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["machine_config_pool_selector"]
    rows:
      machine_config_pool_selector:
        header: [["Machine Config Pool Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#machineConfigPoolSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  logpad:
    infogetter: "logpad_formatted"
    infogetter_args:
      formatter: "format_yaml"
      path: "spec#kubeletConfig"
    timestamps: false
  shortcuts:
    "Machine Config Pool Selector":
      key: "t"
      read_only: true
      helptext: "Show Machine Config Pool selector"
      widget: "windowwidget"
      widget_args:
        title: "Machine Config Pool Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#machineConfigPoolSelector"
