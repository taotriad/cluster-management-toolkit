---
kind: "OptimizationJob"
api_family: "trainer.kubeflow.org"
default_command: "optimizationjobs"
command:
  - "optjobs"
  - "optjob"
listview:
  name: "Optimization Jobs"
  group: "Kubeflow"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "trials", "parallel_trials", "age"]
      sortcolumn: "namespace"
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
  fields:
    parallel_trials:
      header: "Parallel Trials:"
      path: "spec#parallelTrials"
      default: "<unset>"
      type: "int"
      formatter: "numerical"
      align: "right"
    trials:
      header: "Trials:"
      path: "spec#numTrials"
      default: "<unset>"
      type: "int"
      formatter: "numerical"
      align: "right"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Optimization Job Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["trials", "parallel_trials",
                 "result_header",
                 "result_train_job_name",
                 "result_parameters"]
    rows:
      parallel_trials:
        header: [["Parallel Trials:", ["main", "infoheader"]]]
        path: "spec#parallelTrials"
        default: "<unset>"
        type: "int"
        formatter: "numerical"
      result_header:
        header: [["Result:", ["main", "infoheader"]]]
      result_parameters:
        header: [["  ", ["main", "infoheader"]],
                 ["P", ["main", "infoheader_shortcut"]],
                 ["arameters:", ["main", "infoheader"]]]
        paths:
          - path: "status#result#parameters"
            pathtype: "items"
            subpaths:
              - "name"
              - "value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
      result_train_job_name:
        header: [["  Train ", ["main", "infoheader"]],
                 ["J", ["main", "infoheader_shortcut"]],
                 ["ob:", ["main", "infoheader"]]]
        path: "status#result#trainJobName"
        default: "<unset>"
        type: "str"
      trials:
        header: [["Trials:", ["main", "infoheader"]]]
        path: "spec#numTrials"
        default: "<unset>"
        type: "int"
        formatter: "numerical"
  logpad:
    title: "TrainJob Template:"
    infogetter: "logpad_formatted"
    infogetter_args:
      formatter: "format_yaml"
      path: "spec#trainJobTemplate"
      reparent: "trainJobTemplate"
    timestamps: false
  shortcuts:
    "Open Train Job":
      key: "j"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for Train Job"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        namespace_path: "metadata#namespace"
        name_path: "status#result#trainJobName"
        kind: "TrainJob"
        api_family: "trainer.kubeflow.org"
    "List Parameters":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "List parameters"
      widget: "windowwidget"
      widget_args:
        title: "Parameters:"
        headers: ["Name:", "Value:"]
        formatting: [["windowwidget", "default"],
                     ["windowwidget", "highlight"]]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "status#result#parameters"
          fields:
            - "name"
            - "value"
        # Not supported for now
        sortcolumn: "key"
    "Train Job Template":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "Show Train Job template"
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "Train Job Template"
        _pass_obj: true
        path: "spec#trainJobTemplate"
