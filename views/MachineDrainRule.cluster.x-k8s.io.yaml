---
kind: "MachineDrainRule"
api_family: "cluster.x-k8s.io"
default_command: "machinedrainrules"
listview:
  name: "Machine Drain Rules"
  group: "Cluster Configuration"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "behavior", "order", "age"]
      sortcolumn: "namespace"
  fields:
    behavior:
      header: "Behavior:"
      path: "spec#drain#behavior"
      default: "<unset>"
      type: "str"
    order:
      header: "Order:"
      path: "spec#drain#order"
      default: "<unset>"
      type: "int"
      formatter: "numerical"
infoview:
  name: "Machine Drain Rule Info"
  infopad:
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      paths:
        - path: "spec#pods"
          key_name: "type"
          key_value: "Pods"
        - path: "spec#machines"
          key_name: "type"
          key_value: "Machines"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["type",
                 "cluster_selector",
                 "selector",
                 "namespace_selector"]
    fields:
      cluster_selector:
        header: "Cluster Selector:"
        paths:
          - path: "clusterSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      selector:
        header: "Selector:"
        paths:
          - path: "selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      namespace_selector:
        header: "Namespace Selector:"
        paths:
          - path: "namespaceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      type:
        header: "Type:"
        path: "type"
        default: "<unknown>"
        type: "str"
