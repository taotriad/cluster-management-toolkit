---
kind: "ValidatingAdmissionPolicyBinding"
api_family: "admissionregistration.k8s.io"
default_command: "validatingadmissionpolicybindings"
command:
  - "vapolbindings"
  - "vapolbinding"
  - "vapolbs"
  - "vapolb"
listview:
  name: "Validating Admission Policy Bindings"
  group: "API & Extendability"
  field_indexes:
    Normal:
      fields: ["name", "policy_name", "param_ref", "age"]
  fields:
    param_ref:
      header: "Parameter Reference:"
      path: "spec#paramRef#name"
      default: "<unset>"
      type: "str"
    policy_name:
      header: "Policy:"
      path: "spec#policyName"
      default: "<unset>"
      type: "str"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Validating Admission Policy Binding Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["policy_name",
                 "param_ref_header",
                 "param_ref_name",
                 "param_ref_namespace",
                 "param_ref_parameter_not_found_action",
                 "param_ref_selector",
                 "match_resources_header",
                 "match_policy",
                 "namespace_selector",
                 "object_selector",
                 "validation_actions"]
    rows:
      match_policy:
        header: [["  Match Policy:", ["main", "infoheader"]]]
        path: "spec#matchResources#matchPolicy"
        default: "<unset>"
        type: "str"
      match_resources_header:
        header: [["Match Resources:", ["main", "infoheader"]]]
      namespace_selector:
        header: [["  Namespace ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#matchResources#namespaceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      object_selector:
        header: [["  Objec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 [" Selector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#matchResources#objectSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      param_ref_header:
        header: [["Parameter Reference:", ["main", "infoheader"]]]
      param_ref_name:
        header: [["  Name:", ["main", "infoheader"]]]
        path: "spec#paramRef#name"
        default: "<unset>"
        type: "str"
      param_ref_namespace:
        header: [["  Namespace:", ["main", "infoheader"]]]
        path: "spec#paramRef#namepace"
        default: "<unset>"
        type: "str"
      param_ref_parameter_not_found_action:
        header: [["  Parameter Not Found Action:", ["main", "infoheader"]]]
        path: "spec#paramRef#parameterNotFoundAction"
        default: "<unset>"
        type: "str"
      param_ref_selector:
        header: [["  Select", ["main", "infoheader"]],
                 ["o", ["main", "infoheader_shortcut"]],
                 ["r:", ["main", "infoheader"]]]
        paths:
          - path: "spec#paramRef#selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      policy_name:
        header: [["P", ["main", "infoheader_shortcut"]],
                 ["olicy:", ["main", "infoheader"]]]
        path: "spec#policyName"
        type: "str"
      validation_actions:
        header: [["Validation Actions:", ["main", "infoheader"]]]
        paths:
          - path: "spec#validationActions"
            pathtype: "list"
        formatter: "list"
  shortcuts:
    "Namespace Selector":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Show Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#matchResources#namespaceSelector"
    "Object Selector":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "Show object selector"
      widget: "windowwidget"
      widget_args:
        title: "Object Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#matchResources#objectSelector"
    "Parameter Reference Selector":
      key: "o"
      read_only: true
      helptext: "Show parameter reference selector"
      widget: "windowwidget"
      widget_args:
        title: "Parameter Reference Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#paramRef#selector"
    "Show ValidatingAdmissionPolicy":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "Open list page for Validating Admission Policy"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        name_path: "spec#policyName"
        kind: "ValidatingAdmissionPolicy"
        api_family: "admissionregistration.k8s.io"
