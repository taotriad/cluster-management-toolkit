---
kind: "ExpansionTemplatePodStatus"
api_family: "status.gatekeeper.sh"
default_command: "expansiontemplatepodstatuses"
command:
  - "exptmplpodstats"
  - "exptmplpodstat"
listview:
  name: "Expansion Template Pod Statuses"
  group: "Policy"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "age", "operations"]
    Normal:
      fields: ["namespace", "name", "age"]
  fields:
    operations:
      header: "Operations:"
      path: "status#operations"
      default: ["<none>"]
      type: "raw"
      formatter: "list"
infoview:
  name: "Expansion Template Pod Status Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["id", "operations"]
    rows:
      id:
        header: [["ID:", ["main", "infoheader"]]]
        path: "status#id"
        default: "<unset>"
        type: "str"
      operations:
        header: [["Operations:", ["main", "infoheader"]]]
        path: "status#operations"
        default: ["<none>"]
        type: "raw"
        formatter: "list"
