---
kind: "Server"
api_family: "policy.linkerd.io"
default_command: "servers"
command:
  - "srv"
listview:
  name: "Servers"
  group: "Network"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "port", "protocol"]
      sortcolumn: "namespace"
  fields:
    port:
      header: "Port:"
      path: "spec#port"
      type: "str"
    protocol:
      header: "Protocol:"
      path: "spec#proxyProtocol"
      type: "str"
infoview:
  name: "Server Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["pod_selector", "port", "proxy_protocol"]
    rows:
      pod_selector:
        header: [["Pod Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#podSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      port:
        header: [["Port:", ["main", "infoheader"]]]
        path: "spec#port"
        type: "str"
      proxy_protocol:
        header: [["Proxy Protocol:", ["main", "infoheader"]]]
        path: "spec#proxyProtocol"
        type: "str"
  shortcuts:
    "Selector":
      key: "t"
      read_only: true
      helptext: "Show selector"
      widget: "windowwidget"
      widget_args:
        title: "Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#podSelector"
