---
kind: "Workload"
api_family: "scheduling.k8s.io"
default_command: "workloads"
command:
  - "wls"
  - "wl"
listview:
  name: "Workloads"
  group: "Workloads"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "controller", "age"]
  fields:
    controller:
      header: "Controller:"
      paths:
        - path: [["spec#controllerRef#kind"], ["spec#controllerRef#apiGroup"],
                 ["spec#controllerRef#name"]]
          pathtype: "tuple"
          default: ["<unset>"]
      formatter: "list"
      formatting:
        field_colors:
          - type: "kind"
          - type: "api_group"
          - type: "generic"
        field_separators:
          - type: "kind_api_group"
          - type: "kind"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Workload Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["controller"]
    rows:
      controller:
        header: [["C", ["main", "infoheader_shortcut"]],
                 ["ontroller:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#controllerRef#kind"], ["spec#controllerRef#apiGroup"],
                   ["spec#controllerRef#name"]]
            pathtype: "tuple"
            default: ["<unset>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      paths:
        - path: "spec#podGroupTemplates"
          key_name: "kind"
          key_value: "PodGroup"
          type: "list"
        - path: "spec#compositePodGroupTemplates"
          key_name: "kind"
          key_value: "CompositePodGroup"
          type: "list"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["kind", "name", "disruption_mode", "policy",
                 "priority", "priority_class"]
        sortcolumn: "name"
    fields:
      disruption_mode:
        header: "Disruption Mode:"
        paths:
          - path: "disruptionMode"
            pathtype: "substitution"
            substitute: "Single"
            else: null
            when:
              - key: "single"
                notmissing: "single"
          - path: "disruptionMode"
            pathtype: "substitution"
            substitute: "All"
            else: null
            when:
              - key: "all"
                notmissing: "all"
        default: "<unset>"
        type: "str"
      kind:
        header: "Kind:"
        path: "kind"
        default: "<unset>"
        type: "str"
        formatting:
          field_colors:
            - type: "kind"
      name:
        header: "Name:"
        path: "name"
        default: "<unset>"
        type: "str"
      policy:
        header: "Policy:"
        paths:
          - path: "schedulingPolicy"
            pathtype: "substitution"
            substitute: "Gang"
            else: null
            when:
              - key: "gang"
                notmissing: "gang"
          - path: "schedulingPolicy"
            pathtype: "substitution"
            substitute: "Basic"
            else: null
            when:
              - key: "basic"
                notmissing: "basic"
        default: "<unset>"
        type: "str"
      priority:
        header: "Priority:"
        path: "priority"
        default: "<unset>"
        type: "int"
        formatter: "numerical"
      priority_class:
        header: "Priority Class:"
        path: "priorityClassName"
        default: "<default>"
        type: "str"
  shortcuts:
    "Open controller":
      key: "c"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for controller"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind_path: "spec#controllerRef#kind"
        api_group_path: "spec#controllerRef#apiGroup"
        namespace_path: "metadata#namespace"
        name_path: "spec#controllerRef#name"
