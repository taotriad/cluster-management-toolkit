---
kind: "StagedKubernetesNetworkPolicy"
api_family: "crd.projectcalico.org"
default_command: "stagedkubernetesnetworkpolicies.crd.projectcalico.org"
command:
  - "stagedkubernetesnetworkpolicy.crd.projectcalico.org"
  - "stagedkubernetesnetworkpolicies.calico"
  - "stagedkubernetesnetworkpolicy.calico"
  - "sknetpols"
  - "sknetpol"
listview:
  name: "Staged Kubernetes Network Policies"
  group: "Calico"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "pod_selector", "types", "age"]
      sortcolumn: "namespace"
  fields:
    pod_selector:
      header: "Pod Selector:"
      paths:
        - path: "spec#podSelector"
          pathtype: "obj"
          default: "<none>"
      formatter: "selector"
    types:
      header: "Types:"
      path: "spec#policyTypes"
      default: ["<unset>"]
      type: "raw"
      formatter: "list"
infoview:
  name: "Staged Kubernetes Network Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["pod_selector", "types"]
    rows:
      pod_selector:
        header: [["Pod Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#podSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      types:
        header: [["Types:", ["main", "infoheader"]]]
        path: "spec#policyTypes"
        default: ["<unset>"]
        type: "raw"
        formatter: "list"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      paths:
        - path: "spec#egress"
          key_name: "__policy"
          key_value: "Egress"
        - path: "spec#ingress"
          key_name: "__policy"
          key_value: "Ingress"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["policy", "ports", "to", "from"]
        sortcolumn: "policy"
    fields:
      from:
        header: "From:"
        paths:
          - path: "from"
            pathtype: "key_value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
      policy:
        header: "Policy:"
        path: "__policy"
        type: "str"
      ports:
        header: "Ports:"
        paths:
          - path: "spec#ports"
            pathtype: "items"
            subpaths:
              - "port"
              - "endPort"
              - "protocol"
            type: "raw"
        formatter: "list"
        formatting:
          field_colors:
            - type: "port"
            - type: "port"
            - type: "protocol"
          field_separators:
            - type: "range"
            - type: "service"
      to:
        header: "To:"
        paths:
          - path: "to"
            pathtype: "key_value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
  shortcuts:
    "Pod Selector":
      key: "t"
      read_only: true
      helptext: "Show Pod selector"
      widget: "windowwidget"
      widget_args:
        title: "Pod Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#podSelector"
