---
kind: "BundleNamespaceMapping"
api_family: "fleet.cattle.io"
default_command: "bundlenamespacemappings.fleet.cattle.io"
command:
  - "bundlensmaps.cattle"
  - "bundlensmap.cattle"
listview:
  name: "Bundle Namespace Mappings"
  group: "Rancher"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
infoview:
  name: "Bundle Namespace Mapping Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["bundle_selector", "namespace_selector"]
    rows:
      bundle_selector:
        header: [["Bundle Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "bundleSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      namespace_selector:
        header: [["Namespace ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "namespaceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  listpad:
    listgetter: "generic_listgetter"
    listgetter_args:
      _kind: "Bundle"
      _api_family: "fleet.cattle.io"
      _label_selector_path: "spec#bundleSelector#matchLabels"
    infogetter: "generic_infogetter"
    on_activation:
      call: "resourceinfodispatch"
      kind: "Bundle"
      api_family: "fleet.cattle.io"
    field_indexes:
      Normal:
        fields: ["namespace", "name", "default_namespace", "ready", "age"]
        sortcolumn: "ready"
    fields:
      default_namespace:
        header: "Default Namespace:"
        path: "spec#defaultNamespace"
        type: "str"
        formatting:
          field_colors:
            - type: "namespace"
      ready:
        header: "Ready:"
        paths:
          - path: [["status#summary#ready"], ["status#summary#desiredReady"]]
            pathtype: "tuple"
        formatter: "list"
        formatting:
          field_colors:
            - type: "numerical"
          field_separators:
            - type: "fraction"
        align: "right"
  shortcuts:
    "Bundle Selector":
      key: "t"
      read_only: true
      helptext: "Show Bundle selector"
      widget: "windowwidget"
      widget_args:
        title: "Bundle Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "bundleSelector"
    "Namespace Selector":
      key: "S"
      read_only: true
      helptext: "Show Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "namespaceSelector"
