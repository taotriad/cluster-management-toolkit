---
kind: "CompositePodGroup"
api_family: "scheduling.k8s.io"
default_command: "podgroups"
command:
  - "comppodgrps"
  - "comppodgrp"
  - "cpgs"
  - "cpg"
listview:
  name: "Composite Pod Groups"
  group: "Workloads"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "policy", "disruption_mode",
               "workload", "age"]
      sortcolumn: "namespace"
  fields:
    disruption_mode:
      header: "Disruption Mode:"
      paths:
        - path: "spec#disruptionMode"
          pathtype: "substitution"
          substitute: "Single"
          else: null
          when:
            - key: "single"
              notmissing: "single"
        - path: "spec#disruptionMode"
          pathtype: "substitution"
          substitute: "All"
          else: null
          when:
            - key: "all"
              notmissing: "all"
      default: "<unset>"
      type: "str"
    policy:
      header: "Policy:"
      paths:
        - path: "spec#schedulingPolicy"
          pathtype: "substitution"
          substitute: "Gang"
          else: null
          when:
            - key: "gang"
              notmissing: "gang"
        - path: "spec#schedulingPolicy"
          pathtype: "substitution"
          substitute: "Basic"
          else: null
          when:
            - key: "basic"
              notmissing: "basic"
      default: "<unset>"
      type: "str"
    workload:
      header: "Workload:"
      path: "spec#workloadRef#workloadName"
      default: "<none>"
      type: "str"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Composite Pod Group Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["disruption_mode", "policy",
                 "priority", "priority_class",
                 "workload_header",
                 "workload_name",
                 "workload_template"]
    rows:
      disruption_mode:
        header: [["Disruption Mode:", ["main", "infoheader"]]]
        paths:
          - path: "spec#disruptionMode"
            pathtype: "substitution"
            substitute: "Single"
            else: null
            when:
              - key: "single"
                notmissing: "single"
          - path: "spec#disruptionMode"
            pathtype: "substitution"
            substitute: "All"
            else: null
            when:
              - key: "all"
                notmissing: "all"
        default: "<unset>"
        type: "str"
      policy:
        header: [["Policy:", ["main", "infoheader"]]]
        paths:
          - path: "spec#schedulingPolicy"
            pathtype: "substitution"
            substitute: "Gang"
            else: null
            when:
              - key: "gang"
                notmissing: "gang"
          - path: "spec#schedulingPolicy"
            pathtype: "substitution"
            substitute: "Basic"
            else: null
            when:
              - key: "basic"
                notmissing: "basic"
        default: "<unset>"
        type: "str"
      priority:
        header: [["Priority:", ["main", "infoheader"]]]
        path: "spec#priority"
        default: "<unset>"
        type: "int"
        formatter: "numerical"
      priority_class:
        header: [["P", ["main", "infoheader_shortcut"]],
                 ["riority Class:", ["main", "infoheader"]]]
        path: "spec#priorityClassName"
        default: "<default>"
        type: "str"
      workload_header:
        header: [["Workload:", ["main", "infoheader"]]]
      workload_name:
        header: [["  ", ["main", "infoheader"]],
                 ["W", ["main", "infoheader_shortcut"]],
                 ["orkload:", ["main", "infoheader"]]]
        path: "spec#workloadRef#workloadName"
        default: "<none>"
        type: "str"
      workload_template:
        header: [["  Template:", ["main", "infoheader"]]]
        path: "spec#workloadRef#templateName"
        default: "<none>"
        type: "str"
  shortcuts:
    "Priority Class":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for Priority Class"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "PriorityClass"
        api_family: "scheduling.k8s.io"
        name_path: "spec#priorityClassName"
    "Workload":
      key: "w"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for Workload"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "Workload"
        api_family: "scheduling.k8s.io"
        namespace_path: "metadata#namespace"
        name_path: "spec#workloadRef#workloadName"
