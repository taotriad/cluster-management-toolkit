---
kind: "DestinationRule"
api_family: "networking.istio.io"
default_command: "destinationrules"
command:
  - "destrules"
  - "destrule"
  - "dstrules"
  - "dstrule"
listview:
  name: "Destination Rules"
  group: "Istio"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "host", "age"]
      sortcolumn: "namespace"
  fields:
    host:
      header: "Host:"
      path: "spec#host"
      type: "str"
infoview:
  name: "Destination Rule Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["host", "export_to", "workload_selector"]
    rows:
      export_to:
        header: [["Export To:", ["main", "infoheader"]]]
        paths:
          - path: "spec#exportTo"
            pathtype: "remap"
            substitutions:
              "*": "All"
              ".": "Same"
            default: "All"
      host:
        header: [["Host:", ["main", "infoheader"]]]
        path: "spec#host"
        type: "str"
      workload_selector:
        header: [["Workload Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#workloadSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  logpad:
    infogetter: "logpad_formatted"
    infogetter_args:
      formatter: "format_yaml"
      paths:
        - path: "spec#trafficPolicy"
          name: "trafficPolicy"
        - path: "spec#subsets"
          name: "subsets"
      merge_paths: true
    timestamps: false
  shortcuts:
    "Workload Selector":
      key: "t"
      read_only: true
      helptext: "Show workload selector"
      widget: "windowwidget"
      widget_args:
        title: "Workload Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#workloadSelector"
