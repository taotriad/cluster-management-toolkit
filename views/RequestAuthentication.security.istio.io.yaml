---
kind: "RequestAuthentication"
api_family: "security.istio.io"
default_command: "requestauthentications"
command:
  - "requestauths"
  - "requestauth"
  - "reqauths"
  - "reqauth"
listview:
  name: "Request Authentications"
  group: "Istio"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Request Authentication Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["selector"]
    rows:
      selector:
        header: [["Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  listpad:
    on_activation:
      call: "resourceinfodispatch"
      kind: "__JWTRule"
    listgetter: "listgetter_path"
    listgetter_args:
      path: "spec#jwtRules"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["issuer", "timeout", "forward_original_token"]
        sortcolumn: "issuer"
    fields:
      forward_original_token:
        header: "Forward Original Token:"
        path: "forwardOriginalToken"
        default: false
        type: "bool"
      issuer:
        header: "Issuer:"
        path: "issuer"
        type: "str"
      timeout:
        header: "Timeout:"
        path: "timeout"
        default: 5
        type: "int"
        formatter: "numerical"
        align: "right"
  shortcuts:
    "Selector":
      key: "t"
      read_only: true
      helptext: "Show selector"
      widget: "windowwidget"
      widget_args:
        title: "Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#selector"
    "Target References":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "Show target references"
      widget: "windowwidget"
      widget_args:
        headers: ["Kind:", "Group:", "Name:"]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#targetRefs"
          fields:
            - "kind"
            - "group"
            - "name"
        # This isn't supported for now
        sortcolumn: "group"
