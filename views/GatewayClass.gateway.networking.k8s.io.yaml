---
kind: "GatewayClass"
api_family: "gateway.networking.k8s.io"
default_command: "gatewayclasses"
command:
  - "gwclasses"
  - "gwclass"
listview:
  name: "Gateway Classes"
  group: "Network"
  field_indexes:
    Wide:
      fields: ["name", "controller_name", "age", "description"]
    Normal:
      fields: ["name", "controller_name", "age"]
  fields:
    controller_name:
      header: "Controller Name:"
      path: "spec#controllerName"
      type: "str"
    description:
      header: "Description:"
      path: "spec#description"
      default: "<unset>"
      type: "str"
infoview:
  name: "Gateway Class Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["controller_name", "description", "parameters_ref",
                 "supported_features"]
    rows:
      controller_name:
        header: [["Controller Name:", ["main", "infoheader"]]]
        path: "spec#controllerName"
        type: "str"
      description:
        header: [["Description:", ["main", "infoheader"]]]
        path: "spec#description"
        default: "<unset>"
        type: "str"
      parameters_ref:
        header: [["P", ["main", "infoheader_shortcut"]],
                 ["arameters Reference:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#parametersRef#kind"], ["spec#parametersRef#group"],
                   ["spec#parametersRef#namespace"],
                   ["spec#parametersRef#name"]]
            pathtype: "tuple"
            type: ["kind", "api_group", "name", "name"]
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "namespace"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
            - type: "namespace"
      supported_features:
        header: [["S", ["main", "infoheader_shortcut"]],
                 ["upported Features:", ["main", "infoheader"]]]
        paths:
          - path: "status#supportedFeatures"
            pathtype: "items"
            subpaths:
              - "name"
            default: ["<none>"]
        formatter: "list"
  shortcuts:
    "List Supported Features":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "List supported features"
      widget: "windowwidget"
      widget_args:
        title: "Supported Features:"
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "status#supportedFeatures"
          fields:
            - "name"
        # Not supported for now
        sortcolumn: "name"
    "Open Parameters Reference":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "Open parameters reference"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind_path: "spec#parametersRef#kind"
        api_group_path: "spec#parametersRef#group"
        name_path: "spec#parametersRef#name"
        namespace_path: "spec#parametersRef#namespace"
