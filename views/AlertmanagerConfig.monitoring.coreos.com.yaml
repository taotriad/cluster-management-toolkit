---
kind: "AlertmanagerConfig"
api_family: "monitoring.coreos.com"
default_command: "alertmanagerconfigs"
command:
  - "almconfs"
  - "almconf"
listview:
  name: "Alertmanager Configs"
  group: "Observability"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Alertmanager Config Info"
  infopad:
  logpad:
    infogetter: "logpad_formatted"
    infogetter_args:
      formatter: "format_yaml"
      path: "spec"
    timestamps: false
