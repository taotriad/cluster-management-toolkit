---
kind: "PeerAuthentication"
api_family: "security.istio.io"
default_command: "peerauthentications"
command:
  - "peerauths"
  - "peerauth"
listview:
  name: "Peer Authentications"
  group: "Istio"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "mtls_mode", "age"]
      sortcolumn: "namespace"
  fields:
    mtls_mode:
      header: "mTLS Mode:"
      path: "spec#mtls#mode"
      default: "INHERIT"
      type: "str"
infoview:
  name: "Peer Authentication Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["selector", "mtls_mode", "port_level_mtls"]
    rows:
      mtls_mode:
        header: [["mTLS Mode:", ["main", "infoheader"]]]
        path: "spec#mtls#mode"
        default: "INHERIT"
        type: "str"
      port_level_mtls:
        header: [["Port Level mTLS:", ["main", "infoheader"]]]
        paths:
          - path: ["spec#portLevelMtls"]
            pathtype: "key_value"
            subpaths: ["mode"]
        type: "raw"
        formatter: "list"
        formatting:
          field_colors:
            - type: "port"
            - type: "generic"
      selector:
        header: [["Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  shortcuts:
    "Selector":
      key: "t"
      read_only: true
      helptext: "Show selector"
      widget: "windowwidget"
      widget_args:
        title: "Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#selector"
