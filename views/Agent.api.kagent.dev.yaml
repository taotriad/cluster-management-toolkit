---
kind: "Agent"
api_family: "api.kagent.dev"
default_command: "agents.api.kagent.dev"
command:
  - "kaagents"
  - "kaagent"
listview:
  name: "Agents"
  group: "Machine Learning"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Agent Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["harness"]
    rows:
      harness:
        header: [["Harne", ["main", "infoheader"]],
                 ["s", ["main", "infoheader_shortcut"]],
                 ["s:", ["main", "infoheader"]]]
        path: "spec#harnessRef#name"
        default: "<unset>"
        type: "str"
  logpad:
    infogetter: "logpad_formatted"
    infogetter_args:
      path: "spec#template"
      formatter: "format_yaml"
    timestamps: false
  shortcuts:
    "Open Harness":
      key: "s"
      read_only: true
      helptext: "Open info page for Harness"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "Harness"
        api_family: "api.kagent.dev"
        name_path: "spec#harnessRef#name"
        namespace_path: "metadata#namespace"
