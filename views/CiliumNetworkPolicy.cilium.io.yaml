---
kind: "CiliumNetworkPolicy"
api_family: "cilium.io"
default_command: "ciliumnetworkpolicies"
command:
  - "ciliumnetpols"
  - "ciliumnetpol"
  - "ciliumnps"
  - "ciliumnp"
  - "cnp"
listview:
  name: "Cilium Network Policies"
  group: "Cilium"
  field_indexes:
    Normal:
      fields: ["namespace", "name",
               "ingress", "ingress_deny",
               "egress", "egress_deny",
               "age", "valid"]
      sortcolumn: "namespace"
    Wide:
      fields: ["namespace", "name",
               "ingress_rules", "ingress_deny_rules",
               "egress_rules", "egress_deny_rules",
               "age", "valid", "description"]
      sortcolumn: "namespace"
  fields:
    description:
      header: "Description:"
      path: "spec#description"
      default: "<unset>"
      type: "str"
    egress_deny:
      header: "Egress Deny:"
      path: "spec#egressDeny"
      type: "len"
      formatter: "numerical"
      align: "right"
    egress_deny_rules:
      header: "Egress Deny Rules:"
      path: "spec#egressDeny"
      type: "len"
      formatter: "numerical"
      align: "right"
    egress:
      header: "Egress:"
      path: "spec#egress"
      type: "len"
      formatter: "numerical"
      align: "right"
    egress_rules:
      header: "Egress Rules:"
      path: "spec#egress"
      type: "len"
      formatter: "numerical"
      align: "right"
    ingress_deny:
      header: "Ingress Deny:"
      path: "spec#ingressDeny"
      type: "len"
      formatter: "numerical"
      align: "right"
    ingress_deny_rules:
      header: "Ingress Deny Rules:"
      path: "spec#ingressDeny"
      type: "len"
      formatter: "numerical"
      align: "right"
    ingress:
      header: "Ingress:"
      path: "spec#ingress"
      type: "len"
      formatter: "numerical"
      align: "right"
    ingress_rules:
      header: "Ingress Rules:"
      path: "spec#ingress"
      type: "len"
      formatter: "numerical"
      align: "right"
    valid:
      header: "Valid:"
      paths:
        - path: "status#conditions"
          pathtype: "items"
          subpaths:
            - "status"
          when:
            - key: "type"
              eq: "Valid"
          default: "<unset>"
      formatter: "value_mapper"
      formatting:
        mapping:
          mappings:
            "False":
              field_colors:
                - context: "main"
                  type: "status_not_ok"
            "True":
              field_colors:
                - context: "main"
                  type: "status_ok"
            "<unset>":
              field_colors:
                - context: "types"
                  type: "unset"
infoview:
  name: "Cilium Network Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["description", "endpoint_selector", "valid"]
    rows:
      description:
        header: [["Description:", ["main", "infoheader"]]]
        path: "spec#description"
        default: "<unset>"
        type: "str"
      endpoint_selector:
        header: [["Endpoint ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#endpointSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      valid:
        header: [["Valid:", ["main", "infoheader"]]]
        paths:
          - path: "status#conditions"
            pathtype: "items"
            subpaths:
              - "status"
            when:
              - key: "type"
                eq: "Valid"
            default: "<unset>"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              "False":
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
              "True":
                field_colors:
                  - context: "main"
                    type: "status_ok"
              "<unset>":
                field_colors:
                  - context: "types"
                    type: "unset"
  shortcuts:
    "Endpoint Selector":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Show Endpoint selector"
      widget: "windowwidget"
      widget_args:
        title: "Endpoint Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#endpointSelector"
    "View Egress Rules":
      key: "e"
      modifier: "shift"
      read_only: true
      helptext: "View egress rules"
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "Egress rules"
        _pass_obj: true
        paths:
          - "spec#egress"
          - "spec#egressDeny"
        include_root: true
    "View Ingress Rules":
      key: "i"
      modifier: "shift"
      read_only: true
      helptext: "View ingress rules"
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "Ingress rules"
        _pass_obj: true
        paths:
          - "spec#ingress"
          - "spec#ingressDeny"
        include_root: true
