---
kind: "AdminNetworkPolicy"
api_family: "policy.networking.k8s.io"
default_command: "adminnetworkpolicies"
command:
  - "adminnetpols"
  - "adminnetpol"
  - "admnetpols"
  - "admnetpol"
listview:
  name: "Admin Network Policies"
  group: "Network"
  field_indexes:
    Normal:
      fields: ["name", "priority", "pod_selector", "pod_namespace_selector",
               "namespace_selector", "age"]
      sortcolumn: "priority"
  fields:
    namespace_selector:
      header: "Namespace Selector:"
      paths:
        - path: "spec#subject#namespaces"
          pathtype: "obj"
          default: "<none>"
      formatter: "selector"
    pod_selector:
      header: "Pod Selector:"
      paths:
        - path: "spec#subject#pods#podSelector"
          pathtype: "obj"
          default: "<none>"
      formatter: "selector"
    pod_namespace_selector:
      header: "Pod Namespace Selector:"
      paths:
        - path: "spec#subject#pods#namespaceSelector"
          pathtype: "obj"
          default: "<none>"
      formatter: "selector"
    priority:
      header: "Priority:"
      path: "spec#priority"
      default: "<unset>"
      type: "int"
      formatter: "numerical"
      align: "right"
infoview:
  name: "Admin Network Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["priority",
                 "subject_header",
                 "subject_namespace_header",
                 "subject_namespace_selector",
                 "subject_pod_header",
                 "subject_pod_selector",
                 "subject_pod_namespace_selector"]
    rows:
      priority:
        header: [["Priority:", ["main", "infoheader"]]]
        path: "spec#priority"
        type: "int"
        formatter: "numerical"
      subject_header:
        header: [["Subject:", ["main", "infoheader"]]]
      subject_namespace_header:
        header: [["  Namespace:", ["main", "infoheader"]]]
      subject_namespace_selector:
        header: [["    Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#subject#namespaces"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      subject_pod_header:
        header: [["  Pod:", ["main", "infoheader"]]]
      subject_pod_selector:
        header: [["    ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#subject#pods#podSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      subject_pod_namespace_selector:
        header: [["    Names", ["main", "infoheader"]],
                 ["p", ["main", "infoheader_shortcut"]],
                 ["ace Selector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#subject#pods#namespaceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  listpad:
    listgetter: "get_netpol_rule_list"
    infogetter: "generic_infogetter"
    on_activation:
      call: "resourceinfodispatch"
      kind: "__ResourceView"
      formatter: "format_yaml"
      obj_path: ""
      title: "Network Policy"
    field_indexes:
      Wide:
        fields: ["policy_type", "name", "action", "ports",
                 "pod_selectors",
                 "pod_namespace_selectors",
                 "namespace_selectors",
                 "node_selectors",
                 "networks",
                 "domains"]
        sortcolumn: "policy_type"
      Normal:
        fields: ["policy_type", "name", "action", "ports"]
        sortcolumn: "policy_type"
    fields:
      action:
        header: "Action:"
        path: "action"
        type: "str"
      domains:
        header: "Domains:"
        path: "domains"
        type: "raw"
        formatter: "list"
        formatting:
          field_colors:
            - type: "host"
      name:
        header: "Name:"
        path: "name"
        type: "str"
      namespace_selectors:
        header: "Namespace Selector:"
        paths:
          - path: "namespace_selectors"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      networks:
        header: "Networks:"
        path: "networks"
        type: "raw"
        formatter: "address"
      node_selectors:
        header: "Node Selector:"
        paths:
          - path: "node_selectors"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      pod_selectors:
        header: "Pod Selector:"
        paths:
          - path: "pod_selectors"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      pod_namespace_selectors:
        header: "Pod Namespace Selectors:"
        paths:
          - path: "pod_namespace_selectors"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      ports:
        header: "Ports:"
        paths:
          - path: "ports"
            pathtype: "items"
            subpaths:
              - "name"
              - "port"
              - "protocol"
        formatter: "list"
        formatting:
          field_colors:
            - type: "service"
            - type: "port"
            - type: "protocol"
          field_separators:
            - type: "port"
            - type: "service"
      policy_type:
        header: "Policy Type:"
        path: "policy_type"
        type: "str"
  shortcuts:
    "Subject Namespace Selector":
      key: "t"
      read_only: true
      helptext: "Show subject Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Subject Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#subject#namespaces"
    "Subject Pod Selector":
      key: "S"
      modifier: "shift"
      read_only: true
      helptext: "Show subject Pod selector"
      widget: "windowwidget"
      widget_args:
        title: "Subject Pod Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#subject#pods#podSelector"
    "Subject Pod Namespace Selector":
      key: "p"
      read_only: true
      helptext: "Show subject Pod Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Subject Pod Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#subject#pods#namespaceSelector"
