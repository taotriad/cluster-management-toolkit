---
kind: "ProvisioningRequestConfig"
api_family: "kueue.x-k8s.io"
default_command: "provisioningrequestconfigs"
command:
  - "provreqconfigs"
  - "provreqconfig"
  - "provreqconfs"
  - "provreqconf"
listview:
  name: "Provisioning Request Configs"
  group: "Batch Scheduling"
  field_indexes:
    Normal:
      fields: ["name", "age"]
infoview:
  name: "Provisioning Request Config Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["provisioning_class_name", "managed_resources",
                 "parameters",
                 "pod_set_merge_policy",
                 "retry_strategy_header",
                 "retry_strategy_backoff_limit_header",
                 "retry_strategy_backoff_limit_count",
                 "retry_strategy_backoff_base_seconds",
                 "retry_strategy_backoff_max_seconds"]
    rows:
      managed_resources:
        header: [["Managed ", ["main", "infoheader"]],
                 ["R", ["main", "infoheader_shortcut"]],
                 ["esources:", ["main", "infoheader"]]]
        path: "spec#managedResources"
        default: ["ALL"]
        type: "raw"
        formatter: "list"
      parameters:
        header: [["P", ["main", "infoheader_shortcut"]],
                 ["arameters:", ["main", "infoheader"]]]
        paths:
          - path: ["spec#parameters"]
            pathtype: "key_value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
      pod_set_merge_policy:
        header: [["Pod Set Merge Policy:", ["main", "infoheader"]]]
        path: "spec#podSetMergePolicy"
        default: "<unset>"
        type: "str"
      provisioning_class_name:
        header: [["Provisioning Class Name:", ["main", "infoheader"]]]
        path: "spec#provisioningClassName"
        default: "<unset>"
        type: "str"
      retry_strategy_backoff_limit_count:
        header: [["    Count:", ["main", "infoheader"]]]
        path: "spec#retryStrategy#backoffLimitCount"
        default: 3
        type: "int"
        formatter: "numerical"
      retry_strategy_backoff_limit_header:
        header: [["  Backoff Limit:", ["main", "infoheader"]]]
      retry_strategy_backoff_base_seconds:
        header: [["    Base:", ["main", "infoheader"]]]
        path: "spec#retryStrategy#backoffBaseSeconds"
        default: 1800
        type: "int"
        formatter: "numerical"
        formatting:
          unit: "s"
      retry_strategy_backoff_max_seconds:
        header: [["    Max:", ["main", "infoheader"]]]
        path: "spec#retryStrategy#backoffMaxSeconds"
        default: 1800
        type: "int"
        formatter: "numerical"
        formatting:
          unit: "s"
      retry_strategy_header:
        header: [["Retry Strategy:", ["main", "infoheader"]]]
  shortcuts:
    "Managed Resources":
      key: "r"
      modifier: "shift"
      read_only: true
      helptext: "List managed resources"
      widget: "windowwidget"
      widget_args:
        title: "Managed resources:"
        itemgetter: "get_list_as_list"
        itemgetter_args:
          path: "spec#managedResources"
        # This isn't supported for now
        sortcolumn: "resource"
    "List Parameters":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "List parameters"
      widget: "windowwidget"
      widget_args:
        title: "Parameters:"
        headers: ["Key:", "Value:"]
        itemgetter: "get_key_value"
        itemgetter_args:
          path: "spec#parameters"
