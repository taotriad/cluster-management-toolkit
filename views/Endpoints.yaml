---
kind: "Endpoints"
default_command: "endpoints"
command:
  - "ep"
listview:
  name: "Endpoints"
  group: "Core"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "endpoints", "age"]
      sortcolumn: "namespace"
    Normal:
      fields: ["namespace", "name", "endpoints_ellipsise", "age"]
      sortcolumn: "namespace"
  fields:
    # Map ready & non-ready endpoints to ok, not ok;
    # we need some special way to handle this
    endpoints:
      header: "Endpoints:"
      path: "subsets"
      datagetter: "datagetter_endpoint_ips"
      formatter: "list_with_status"
    endpoints_ellipsise:
      header: "Endpoints:"
      path: "subsets"
      datagetter: "datagetter_endpoint_ips"
      formatter: "list_with_status"
      formatting:
        ellipsise: 3
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Endpoints Info"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      path: ""
    infogetter: "get_subsets_info"
    field_indexes:
      Normal:
        fields: ["addresses", "ports", "status"]
        sortcolumn: "status"
    fields:
      addresses:
        header: "Addresses:"
        path: "addresses"
        type: "raw"
        formatter: "address"
      ports:
        header: "Ports:"
        paths:
          - path: "ports"
            pathtype: "items"
            subpaths:
              - "name"
              - "port"
              - "protocol"
            type: "raw"
        formatter: "list"
        formatting:
          field_colors:
            - type: "service"
            - type: "port"
            - type: "protocol"
          field_separators:
            - type: "port"
            - type: "service"
      status:
        header: "Status:"
        path: "status"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              "Ready":
                field_colors:
                  - context: "main"
                    type: "status_ok"
              "Not Ready":
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
