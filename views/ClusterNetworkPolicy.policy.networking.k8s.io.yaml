---
kind: "ClusterNetworkPolicy"
api_family: "policy.networking.k8s.io"
default_command: "networkpolicies"
command:
  - "clrnetpols"
  - "clrnetpol"
listview:
  name: "Cluster Network Policies"
  group: "Network"
  field_indexes:
    Normal:
      fields: ["name", "tier", "priority", "age"]
      sortcolumn: "priority"
  fields:
    priority:
      header: "Priority:"
      path: "spec#priority"
      type: "float"
      formatter: "numerical"
      align: "right"
    tier:
      header: "Tier:"
      path: "spec#tier"
      type: "str"
infoview:
  name: "Cluster Network Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["tier", "priority",
                 "subject_header",
                 "subject_namespace_header",
                 "subject_namespace_selector",
                 "subject_pod_header",
                 "subject_pod_selector",
                 "subject_pod_namespace_selector"]
    rows:
      priority:
        header: [["Priority:", ["main", "infoheader"]]]
        path: "spec#priority"
        type: "float"
        formatter: "numerical"
      subject_header:
        header: [["Subject:", ["main", "infoheader"]]]
      subject_namespace_header:
        header: [["  Namespace:", ["main", "infoheader"]]]
      subject_namespace_selector:
        header: [["    Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#subject#namespaces"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      subject_pod_header:
        header: [["  Pod:", ["main", "infoheader"]]]
      subject_pod_selector:
        header: [["    ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#subject#pods#podSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      subject_pod_namespace_selector:
        header: [["    Names", ["main", "infoheader"]],
                 ["p", ["main", "infoheader_shortcut"]],
                 ["ace Selector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#subject#pods#namespaceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      tier:
        header: [["Tier:", ["main", "infoheader"]]]
        path: "spec#tier"
        default: "<unset>"
        type: "str"
  shortcuts:
    "Subject Namespace Selector":
      key: "t"
      read_only: true
      helptext: "Show subject Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Subject Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#subject#namespaces"
    "Subject Pod Selector":
      key: "S"
      modifier: "shift"
      read_only: true
      helptext: "Show subject Pod selector"
      widget: "windowwidget"
      widget_args:
        title: "Subject Pod Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#subject#pods#podSelector"
    "Subject Pod Namespace Selector":
      key: "p"
      read_only: true
      helptext: "Show subject Pod Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Subject Pod Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#subject#pods#namespaceSelector"
    "View Ingress rules":
      key: "i"
      modifier: "shift"
      read_only: true
      helptext: "View ingress rules"
      action: "call"
      action_call: "view_yaml"
      action_args:
        _pass_obj: true
        title: "Ingress rules"
        path: "spec#ingress"
        include_root: true
    "View Egress rules":
      key: "e"
      modifier: "shift"
      read_only: true
      helptext: "View egress rules"
      action: "call"
      action_call: "view_yaml"
      action_args:
        _pass_obj: true
        title: "Egress rules"
        path: "spec#egress"
        include_root: true
