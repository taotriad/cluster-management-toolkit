---
kind: "ETCDSnapshotFile"
api_family: "k3s.cattle.io"
default_command: "etcdsnapshotfiles"
listview:
  name: "ETCD Snapshot Files"
  group: "Rancher"
  field_indexes:
    Wide:
      fields: ["name", "node_name", "size",
               "ready", "age", "snapshot_name", "location"]
    Normal:
      fields: ["name", "node_name", "size", "ready", "age"]
  fields:
    location:
      header: "Location:"
      path: "spec#location"
      type: "str"
      formatter: "uri"
    node_name:
      header: "Node:"
      path: "spec#nodeName"
      type: "host"
      default: "<none>"
      formatting:
        field_colors:
          - type: "host"
    ready:
      header: "Ready:"
      path: "status#readyToUse"
      type: "str"
      formatter: "value_mapper"
      formatting:
        mapping:
          mappings:
            "False":
              field_colors:
                - context: "main"
                  type: "status_pending"
            "True":
              field_colors:
                - context: "main"
                  type: "status_ok"
    size:
      header: "Size:"
      paths:
        - path: "status#size"
          type: "disk_usage"
          default: 0
      formatter: "numerical"
    snapshot_name:
      header: "Snapshot Name:"
      path: "spec#snapshotName"
      type: "str"
infoview:
  name: "ETCD Snapshot File Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["node_name", "location", "snapshot_name",
                 "location", "size", "ready_to_use"]
    rows:
      location:
        header: [["Location:", ["main", "infoheader"]]]
        path: "spec#location"
        type: "str"
        formatter: "uri"
      node_name:
        header: [["No", ["main", "infoheader"]],
                 ["d", ["main", "infoheader_shortcut"]],
                 ["e:", ["main", "infoheader"]]]
        path: "spec#nodeName"
        type: "host"
        default: "<none>"
        formatting:
          field_colors:
            - type: "host"
      ready_to_use:
        header: [["Ready to Use:", ["main", "infoheader"]]]
        path: "status#readyToUse"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              "False":
                field_colors:
                  - context: "main"
                    type: "status_pending"
              "True":
                field_colors:
                  - context: "main"
                    type: "status_ok"
      size:
        header: [["Size:", ["main", "infoheader"]]]
        paths:
          - path: "status#size"
            type: "disk_usage"
            default: 0
        formatter: "numerical"
      snapshot_name:
        header: [["Snapshot Name:", ["main", "infoheader"]]]
        path: "spec#snapshotName"
        type: "str"
  shortcuts:
    "Node":
      key: "d"
      read_only: true
      helptext: "Open info page for Node"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "Node"
        name_path: "spec#nodeName"
