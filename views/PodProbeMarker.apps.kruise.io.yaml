---
kind: "PodProbeMarker"
api_family: "apps.kruise.io"
default_command: "podprobemarkers"
listview:
  name: "Pod Probe Markers"
  group: "Kruise"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
infoview:
  name: "Pod Probe Markers Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["selector"]
    rows:
      selector:
        header: [["Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  listpad:
    on_activation:
      call: "resourceinfodispatch"
      kind: "__PodProbeMarkerProbe"
      api_family: "apps.kruise.io"
    listgetter: "listgetter_path"
    listgetter_args:
      path: "spec#probes"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["name", "container_name", "pod_condition_type"]
    fields:
      container_name:
        header: "Container Name:"
        path: "containerName"
        type: "str"
      name:
        header: "Name:"
        path: "name"
        type: "str"
      pod_condition_type:
        header: "Pod Condition Type:"
        path: "podConditionType"
        type: "str"
  shortcuts:
    "Selector":
      key: "t"
      read_only: true
      helptext: "Show selector"
      widget: "windowwidget"
      widget_args:
        title: "Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#selector"
