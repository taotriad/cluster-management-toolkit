---
kind: "ImageStreamTag"
api_family: "image.openshift.io"
default_command: "imagestreamtags"
command:
  - "imgstreamtags"
  - "imgstreamtag"
  - "imagestreamtag.image.openshift.io"
  - "imagestreamtags.openshift"
  - "imagestreamtag.openshift"
  - "osimagestreamtags"
  - "osimagestreamtag"
  - "osimgstreamtags"
  - "osimgstreamtag"
listview:
  name: "Image Stream Tags"
  group: "OpenShift"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "image_reference", "age", "display_name"]
      sortcolumn: "namespace"
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
  fields:
    display_name:
      header: "Display Name:"
      path: "tag#annotations#openshift.io/display-name"
      default: "<unset>"
      type: "str"
    image_reference:
      header: "Image Reference:"
      path: "image#dockerImageReference"
      type: "str"
infoview:
  name: "Image Stream Tag Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["display_name", "description", "from", "manifest_media_type",
                 "metadata_version", "lookup_policy", "import_policy",
                 "reference_policy", "version"]
    rows:
      description:
        header: [["D", ["main", "infoheader_shortcut"]],
                 ["escription:", ["main", "infoheader"]]]
        path: "tag#annotations#description"
        default: "<unset>"
        type: "str"
      display_name:
        header: [["Display Name:", ["main", "infoheader"]]]
        path: "tag#annotations#openshift.io/display-name"
        default: "<unset>"
        type: "str"
      from:
        header: [["From:", ["main", "infoheader"]]]
        paths:
          - path: [["tag#from#kind"], "://", ["tag#from#name"]]
            pathtype: "tuple"
            default: ["<unset>"]
        formatter: "uri"
      lookup_policy:
        header: [["Lookup Policy:", ["main", "infoheader"]]]
        paths:
          - path: "lookupPolicy"
            pathtype: "substitution"
            when:
              - key: "local"
                eq: true
            substitute: "Local"
          - path: "lookupPolicy"
            pathtype: "substitution"
            when:
              - key: "local"
                eq: false
            substitute: "Remote"
        default: "Remote"
        type: "str"
      import_policy:
        header: [["Import Policy:", ["main", "infoheader"]]]
        path: "tag#importPolicy#importMode"
        default: "<unset>"
        type: "str"
      manifest_media_type:
        header: [["Manifest Media Type:", ["main", "infoheader"]]]
        path: "image#dockerImageManifestMediaType"
        default: "<unset>"
        type: "str"
      metadata_version:
        header: [["Metadata Version:", ["main", "infoheader"]]]
        path: "image#dockerImageMetadataVersion"
        default: "<unset>"
        type: "str"
        formatter: "version"
      reference_policy:
        header: [["Reference Policy:", ["main", "infoheader"]]]
        path: "tag#referencePolicy#type"
        default: "<unset>"
        type: "str"
      version:
        header: [["Version:", ["main", "infoheader"]]]
        path: "spec#annotations#version"
        default: "<unset>"
        type: "str"
        formatter: "version"
  shortcuts:
    "Show Description":
      key: "d"
      modifier: "shift"
      read_only: true
      helptext: "Show description"
      widget: "windowwidget"
      widget_args:
        title: "Description:"
        itemgetter: "get_strings_from_string"
        itemgetter_args:
          path: "tag#annotations#description"
          unescape_newlines: true
    "Docker Image Layers":
      key: "i"
      modifier: "shift"
      read_only: true
      helptext: "List Docker Image Layers"
      widget: "windowwidget"
      widget_args:
        title: "Docker Image Layers:"
        headers: ["Name:", "Size:", "Media Type:"]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "image#dockerImageLayers"
          # pass_ref: true
          fields:
            - "name"
            - "size"
            - "mediaType"
    "Docker Image Metadata":
      key: "d"
      read_only: true
      helptext: "Show Docker Image Metadata"
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "Docker Image Metadata"
        _pass_obj: true
        path: "image#dockerImageMetadata"
