---
kind: "RayCronJob"
api_family: "ray.io"
default_command: "raycronjobs"
listview:
  name: "Ray Cron Jobs"
  group: "KubeRay"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "schedule",
               "last_scheduled", "suspended", "age",
               "containers_jobtemplate"]
      sortcolumn: "namespace"
  fields:
    containers_jobtemplate:
      header: "Containers:"
      paths:
        - paths:
            - "spec#jobTemplate#spec#template#spec#initContainers"
            - "spec#jobTemplate#spec#template#spec#containers"
          pathtype: "items"
          subpaths:
            - "name"
            - subpath: "image"
              regex: ["^.+/(.+?):.+", "^(.+):.+"]
            - subpath: "image"
              regex: ["^.+:(.+)"]
          type: "raw"
      default: ["<none>"]
      formatter: "list"
      formatting:
        field_colors:
          - type: "generic"
          - type: "version"
        field_separators:
          - type: "version"
        field_formatters:
          - ""
          - "version"
    last_scheduled:
      header: "Last Scheduled:"
      path: "status#lastScheduleTime"
      default: -1
      type: "timestamp"
      formatter: "age"
      align: "right"
    schedule:
      header: "Schedule:"
      path: "spec#schedule"
      default: "<unset>"
      type: "str"
    suspended:
      header: "Suspended:"
      path: "spec#suspend"
      default: false
      type: "bool"
      formatter: "value_mapper"
      formatting:
        mapping:
          mappings:
            "False":
              field_colors:
                - context: "main"
                  type: "status_ok"
            "True":
              field_colors:
                - context: "main"
                  type: "status_pending"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
      "Resume resource":
        description: "Resume resource"
        category: "Resource Level"
        actionfunc: "patch_resource"
        extravars:
          action_str: "Resuming"
          args:
            patch:
              spec:
                suspend: false
      "Suspend resource":
        description: "Suspend resource"
        category: "Resource Level"
        actionfunc: "patch_resource"
        extravars:
          action_str: "Suspending"
          args:
            patch:
              spec:
                suspend: true
infoview:
  name: "Ray Cron Job Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["schedule", "last_scheduled", "suspended"]
    rows:
      last_scheduled:
        header: [["Last Scheduled:", ["main", "infoheader"]]]
        path: "status#lastScheduleTime"
        default: -1
        type: "timestamp"
        formatter: "age"
      schedule:
        header: [["Schedule:", ["main", "infoheader"]]]
        path: "spec#schedule"
        default: "<unset>"
        type: "str"
      suspended:
        header: [["Suspended:", ["main", "infoheader"]]]
        path: "spec#suspend"
        default: false
        type: "bool"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              "False":
                field_colors:
                  - context: "main"
                    type: "status_ok"
              "True":
                field_colors:
                  - context: "main"
                    type: "status_pending"
  shortcuts:
    "View RayJob Template":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "Show RayJob Template"
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "RayJob Template"
        _named_title: true
        _pass_obj: true
        path: "spec#jobTemplate"
