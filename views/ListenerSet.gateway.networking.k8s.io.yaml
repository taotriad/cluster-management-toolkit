---
kind: "ListenerSet"
api_family: "gateway.networking.k8s.io"
default_command: "listenersets"
listview:
  name: "Listener Sets"
  group: "Network"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Listener Set Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["parent"]
    rows:
      parent:
        header: [["P", ["main", "infoheader_shortcut"]],
                 ["arent:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#parentRef#kind"], ["spec#parentRef#group"],
                   ["spec#parentRef#name"]]
            pathtype: "tuple"
            type: ["kind", "api_group", "name"]
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      path: "spec#listeners"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["name", "hostname", "port",
                 "allowed_namespaces_source",
                 "allowed_namespaces_selector", "allowed_kinds"]
        sortcolumn: "name"
    fields:
      allowed_kinds:
        header: "Allowed Kinds:"
        paths:
          - path: "allowedRoutes#kinds"
            pathtype: "items"
            subpaths:
              - "kind"
              - "group"
            type: ["kind", "api_group"]
        default: "<none>"
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
          field_separators:
            - type: "kind_api_group"
      allowed_namespaces_selector:
        header: "Allowed Namespaces (Selector):"
        paths:
          - path: "allowedRoutes#namespaces#selector"
            pathtype: "match_expression"
            default: "<none>"
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "operator"
            - type: "value"
          field_separators:
            - type: "space"
            - type: "no_pad"
      allowed_namespaces_source:
        header: "Allowed Namespaces (Source):"
        path: "allowedRoutes#namespaces#from"
        type: "str"
      hostname:
        header: "Hostname:"
        path: "hostname"
        default: "<unset>"
        type: "str"
        formatting:
          field_colors:
            - type: "hostname"
      name:
        header: "Name:"
        path: "name"
        default: "<unset>"
        type: "str"
      port:
        header: "Port:"
        paths:
          - path: [["port"], ["protocol"]]
            pathtype: "tuple"
        formatter: "list"
        formatting:
          field_colors:
            - type: "port"
            - type: "protocol"
          field_separators:
            - type: "service"
  shortcuts:
    "Open Parent":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "Open parent"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind_path: "spec#parentRef#kind"
        api_group_path: "spec#parentRef#group"
        name_path: "spec#parentRef#name"
        namespace_path: "metadata#namespace"
