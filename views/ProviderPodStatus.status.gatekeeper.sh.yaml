---
kind: "ProviderPodStatus"
api_family: "status.gatekeeper.sh"
default_command: "providerpodstatuses"
command:
  - "providerpodstats"
  - "providerpodstat"
  - "provpodstats"
  - "provpodstat"
listview:
  name: "Provider Pod Statuses"
  group: "Policy"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "active", "age", "operations"]
    Normal:
      fields: ["namespace", "name", "active", "age"]
  fields:
    active:
      header: "Active:"
      path: "status#active"
      default: false
      type: "bool"
    operations:
      header: "Operations:"
      path: "status#operations"
      default: ["<none>"]
      type: "raw"
      formatter: "list"
infoview:
  name: "Provider Pod Status Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["id", "operations", "active"]
    rows:
      active:
        header: [["Active:", ["main", "infoheader"]]]
        path: "status#active"
        default: false
        type: "bool"
      id:
        header: [["ID:", ["main", "infoheader"]]]
        path: "status#id"
        default: "<unset>"
        type: "str"
      operations:
        header: [["Operations:", ["main", "infoheader"]]]
        path: "status#operations"
        default: ["<none>"]
        type: "raw"
        formatter: "list"
