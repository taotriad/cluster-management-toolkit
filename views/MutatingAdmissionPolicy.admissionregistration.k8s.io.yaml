---
kind: "MutatingAdmissionPolicy"
api_family: "admissionregistration.k8s.io"
default_command: "mutatingadmissionpolicies"
command:
  - "mapols"
  - "mapol"
listview:
  name: "Mutating Admission Policies"
  group: "API & Extendability"
  field_indexes:
    Normal:
      fields: ["name", "mutations", "param_kind", "age"]
  fields:
    mutations:
      header: "Mutations:"
      path: "spec#mutations"
      type: "len"
      formatter: "numerical"
      align: "right"
    param_kind:
      header: "Parameter Kind:"
      paths:
        - path: [["spec#paramKind#kind"], ["spec#paramKind#apiVersion"]]
          pathtype: "tuple"
          type: ["kind", "api_group"]
          default: "<unset>"
      formatter: "list"
      formatting:
        field_colors:
          - type: "kind"
          - type: "api_group"
        field_separators:
          - type: "kind_api_group"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Mutating Admission Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["param_kind", "failure_policy", "reinvocation_policy",
                 "match_constraints_header", "match_constraints_match_policy",
                 "match_constraints_namespace_selector",
                 "match_constraints_object_selector"]
    rows:
      failure_policy:
        header: [["Failure Policy:", ["main", "infoheader"]]]
        path: "spec#failurePolicy"
        default: "<unset>"
        type: "str"
      match_constraints_header:
        header: [["Match Constraints:", ["main", "infoheader"]]]
      match_constraints_match_policy:
        header: [["  Match Policy:", ["main", "infoheader"]]]
        path: "spec#matchConstraints#matchPolicy"
        type: "str"
      match_constraints_namespace_selector:
        header: [["  Namespace ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#matchConstraints#namespaceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      match_constraints_object_selector:
        header: [["  Objec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 [" Selector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#matchConstraints#objectSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      param_kind:
        header: [["P", ["main", "infoheader_shortcut"]],
                 ["arameter Kind:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#paramKind#kind"], ["spec#paramKind#apiVersion"]]
            pathtype: "tuple"
            type: ["kind", "api_group"]
            default: "<unset>"
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
          field_separators:
            - type: "kind_api_group"
      reinvocation_policy:
        header: [["Reinvocation Policy:", ["main", "infoheader"]]]
        path: "spec#reinvocationPolicy"
        default: "<unset>"
        type: "str"
  listpad:
    on_activation:
      call: "resourceinfodispatch"
      kind: "__MutatingAdmissionPolicyRule"
      api_family: "admissionregistration.k8s.io"
    listgetter: "listgetter_path"
    listgetter_args:
      paths:
        - path: "spec#matchConditions"
          key_name: "type"
          key_value: "Match Condition"
        - path: "spec#mutations"
          key_name: "type"
          key_value: "Mutation"
        - path: "spec#variables"
          key_name: "type"
          key_value: "Variable"
    infogetter: "generic_infogetter"
    field_indexes:
      Wide:
        fields: ["type", "name", "patch_type", "expression"]
        sortcolumn: "type"
      Normal:
        fields: ["type", "name", "patch_type"]
        sortcolumn: "type"
    fields:
      expression:
        header: "Expression:"
        paths:
          - path: ["jsonPatch#expression",
                   "applyConfiguration#expression",
                   "expression"]
            type: "str"
        default: "<unset>"
        type: "str"
        formatter: "selector"
        formatting:
          args:
            selector:
              type: "cel"
      name:
        header: "Name:"
        path: "name"
        default: "<unset>"
        type: "str"
      patch_type:
        header: "Patch Type:"
        path: "patchType"
        type: "str"
      type:
        header: "Type:"
        path: "type"
        type: "str"
  shortcuts:
    "Namespace Selector":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Show Namespace selector"
      widget: "windowwidget"
      widget_args:
        title: "Namespace Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#matchConstraints#namespaceSelector"
    "Object Selector":
      key: "t"
      read_only: true
      helptext: "Show object selector"
      widget: "windowwidget"
      widget_args:
        title: "Object Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#matchConstraints#objectSelector"
    "List Parameter Kind":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "Open list page for parameter kind"
      action: "call"
      action_call: "listviewdispatch"
      action_args:
        _pass_obj: true
        kind_path: "spec#paramKind#kind"
        api_family_path: "spec#paramKind#apiVersion"
