---
kind: "ClusterResourceSet"
api_family: "addons.cluster.x-k8s.io"
default_command: "clusterresourcesets"
command:
  - "clrressets"
  - "clrresset"
listview:
  name: "Cluster Resource Sets"
  group: "Cluster Configuration"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Cluster Resource Set Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["cluster_label_selector", "resources", "strategy"]
    rows:
      cluster_label_selector:
        header: [["Cluster La", ["main", "infoheader"]],
                 ["b", ["main", "infoheader_shortcut"]],
                 ["el Selector:", ["main", "infoheader"]]]
        paths:
          - path: ["spec#clusterSelector#matchLabels"]
            pathtype: "key_value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
      resources:
        header: [["R", ["main", "infoheader_shortcut"]],
                 ["esources:", ["main", "infoheader"]]]
        paths:
          - path: "spec#resources"
            pathtype: "items"
            subpaths:
              - "kind"
              - "name"
            type: ["kind", "name"]
        default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "generic"
          field_separators:
            - type: "kind"
      strategy:
        header: [["Strategy:", ["main", "infoheader"]]]
        path: "spec#strategy"
        default: "<unset>"
        type: "str"
  listpad:
    listgetter: "generic_listgetter"
    listgetter_args:
      _kind: "Cluster"
      _api_family: "cluster.x-k8s.io"
      _label_selector_path: "spec#clusterSelector#matchLabels"
      _none_on_empty_selector: true
    infogetter: "generic_infogetter"
    on_activation:
      call: "resourceinfodispatch"
      kind: "Cluster"
      api_family: "cluster.x-k8s.io"
    field_indexes:
      Normal:
        fields: ["namespace", "name", "controller",
                 "cluster_class", "version", "phase", "age"]
        sortcolumn: "namespace"
    fields:
      cluster_class:
        header: "Cluster Class:"
        path: "spec#topology#class"
        default: "<unset>"
        type: "str"
      controller:
        header: "Controller:"
        paths:
          - path: "metadata#ownerReferences"
            pathtype: "items"
            subpaths:
              - "kind"
              - "apiVersion"
              - "name"
            when:
              - key: "controller"
                eq: true
            type: ["kind", "api_group", "name"]
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
      phase:
        header: "Phase:"
        path: "status#phase"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              Pending:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Provisioning:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Provisioned:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              Deleting:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Failed:
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
      version:
        header: "Version:"
        path: "spec#topology#version"
        default: "<unset>"
        type: "str"
        formatter: "version"
  shortcuts:
    "Cluster Label Selector":
      key: "b"
      read_only: true
      helptext: "Show cluster label selector"
      widget: "windowwidget"
      widget_args:
        title: "Cluster Label Selector:"
        headers: ["Key:", "Value:"]
        itemgetter: "get_key_value"
        itemgetter_args:
          path: "spec#clusterSelector#matchLabels"
    "List Resources":
      key: "r"
      modifier: "shift"
      read_only: true
      helptext: "List sesources"
      widget: "windowwidget"
      widget_args:
        title: "Resources:"
        selectable: true
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#resources"
          fields:
            - "kind"
            - "name"
        # This isn't supported for now
        sortcolumn: "kind"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        kind_path: 0
        name_path: 1
        _parent_namespace_path: "metadata#namespace"
