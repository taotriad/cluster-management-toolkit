---
# WARNING: Do NOT edit this file directly; it is generated from the template
# views/templates/ModuleDocumentation.deckhouse.io.yaml.j2
# edit that file instead.
#
kind: "ModuleDocumentation"
api_family: "deckhouse.io"
default_command: "moduledocumentations"
command:
  - "moddocs"
  - "moddoc"
listview:
  name: "Module Documentations"
  group: "Deckhouse"
  field_indexes:
    Normal:
      fields: ["name", "controller", "path", "version", "age"]
  fields:
    controller:
      header: "Controller:"
      paths:
        - path: "metadata#ownerReferences"
          pathtype: "items"
          subpaths:
            - "kind"
            - "apiVersion"
            - "name"
          when:
            - key: "controller"
              eq: true
          type: ["kind", "api_group", "name"]
          default: ["<none>"]
      formatter: "list"
      formatting:
        field_colors:
          - type: "kind"
          - type: "api_group"
          - type: "generic"
        field_separators:
          - type: "kind_api_group"
          - type: "kind"
    path:
      header: "Path:"
      path: "spec#path"
      default: "<unset>"
      type: "str"
      formatting:
        field_colors:
          - type: "path"
    version:
      header: "Version:"
      path: "spec#version"
      default: "<unset>"
      type: "str"
      formatter: "version"
infoview:
  name: "Module Documentation Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["controller", "path", "version"]
    rows:
      controller:
        header: [["C", ["main", "infoheader_shortcut"]],
                 ["ontroller:", ["main", "infoheader"]]]
        paths:
          - path: "metadata#ownerReferences"
            pathtype: "items"
            subpaths:
              - "kind"
              - "apiVersion"
              - "name"
            when:
              - key: "controller"
                eq: true
            type: ["kind", "api_group", "name"]
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
      path:
        header: [["Path:", ["main", "infoheader"]]]
        path: "spec#path"
        default: "<unset>"
        type: "str"
        formatting:
          field_colors:
            - type: "path"
      version:
        header: [["Version:", ["main", "infoheader"]]]
        path: "spec#version"
        default: "<unset>"
        type: "str"
        formatter: "version"
  shortcuts:
    "Open controller":
      key: "c"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for controller"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        namespace_path: "metadata#namespace"
        owner_reference_path: "metadata#ownerReferences"
