---
kind: "CatalogSource"
api_family: "operators.coreos.com"
default_command: "catalogsources"
command:
  - "catsrcs"
  - "catsrc"
listview:
  name: "Catalog Sources"
  group: "API & Extendability"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "display_name",
               "source_type", "publisher", "priority",
               "connection_state", "age"]
      sortcolumn: "priority"
    Normal:
      fields: ["namespace", "name",
               "publisher", "priority",
               "connection_state", "age"]
      sortcolumn: "priority"
  fields:
    connection_state:
      header: "Connection State:"
      path: "status#connectionState#lastObservedState"
      type: "str"
      formatter: "value_mapper"
      formatting:
        mapping:
          mappings:
            READY:
              field_colors:
                - context: "main"
                  type: "status_ok"
            TRANSIENT_FAILURE:
              field_colors:
                - context: "main"
                  type: "status_warning"
    display_name:
      header: "Display Name:"
      path: "spec#displayName"
      type: "str"
    priority:
      header: "Priority:"
      path: "spec#priority"
      default: "<unset>"
      type: "int"
      formatter: "numerical"
      align: "right"
    publisher:
      header: "Publisher:"
      path: "spec#publisher"
      type: "str"
    source_type:
      header: "Source Type:"
      path: "spec#sourceType"
      type: "str"
infoview:
  name: "Catalogue Source Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["display_name", "image", "publisher",
                 "source_type", "priority",
                 "update_strategy_header",
                 "update_strategy_registry_poll_interval",
                 "registry_service_header",
                 "registry_service_service",
                 "registry_service_protocol",
                 "registry_service_port",
                 "connection_header",
                 "connection_address",
                 "connection_last_connect",
                 "connection_last_observed_state"]
    rows:
      connection_address:
        header: [["  Address:", ["main", "infoheader"]]]
        paths:
          - path: ["status#connectionState#address", "spec#address"]
            pathtype: "regex"
            regex: '(.+):(\d+?)$'
        formatter: "list"
        formatting:
          field_colors:
            - type: "address"
            - type: "port"
          field_separators:
            - type: "port"
          field_formatters:
            - "address"
            - ""
      connection_header:
        header: [["Connection:", ["main", "infoheader"]]]
      connection_last_connect:
        header: [["  Last Connect:", ["main", "infoheader"]]]
        path: "status#connectionState#lastConnect"
        type: "timestamp"
        formatter: "timestamp"
      connection_last_observed_state:
        header: [["  Last Observed State:", ["main", "infoheader"]]]
        path: "status#connectionState#lastObservedState"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              READY:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              TRANSIENT_FAILURE:
                field_colors:
                  - context: "main"
                    type: "status_warning"
      display_name:
        header: [["Display Name:", ["main", "infoheader"]]]
        path: "spec#displayName"
        type: "str"
      image:
        header: [["Image:", ["main", "infoheader"]]]
        paths:
          - path: "spec#image"
            pathtype: "regex"
            regex: "^([^:]+):(.*)"
        formatter: "list"
        formatting:
          field_colors:
            - type: "generic"
            - type: "version"
          field_separators:
            - type: "version"
          field_formatters:
            - ""
            - "version"
      priority:
        header: [["Priority:", ["main", "infoheader"]]]
        path: "spec#priority"
        default: "<unset>"
        type: "int"
        formatter: "numerical"
      publisher:
        header: [["Publisher:", ["main", "infoheader"]]]
        path: "spec#publisher"
        type: "str"
      registry_service_header:
        header: [["Registry Service:", ["main", "infoheader"]]]
      registry_service_port:
        header: [["  Port:", ["main", "infoheader"]]]
        path: "status#registryService#port"
        default: "<unset>"
        type: "str"
        formatting:
          field_colors:
            - type: "port"
      registry_service_protocol:
        header: [["  Protocol:", ["main", "infoheader"]]]
        path: "status#registryService#protocol"
        default: "<unset>"
        type: "str"
        formatting:
          field_colors:
            - type: "protocol"
      registry_service_service:
        header: [["  ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["ervice:", ["main", "infoheader"]]]
        paths:
          - path: [["status#registryService#serviceNamespace"],
                   ["status#registryService#serviceName"]]
            pathtype: "tuple"
        default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "namespace"
            - type: "generic"
          field_separators:
            - type: "namespace"
      source_type:
        header: [["Source Type:", ["main", "infoheader"]]]
        path: "spec#sourceType"
        type: "str"
      update_strategy_header:
        header: [["Update Strategy:", ["main", "infoheader"]]]
      update_strategy_registry_poll_interval:
        header: [["  Registry Poll Interval:", ["main", "infoheader"]]]
        path: "spec#updateStrategy#registryPoll#interval"
        type: "str"
        formatter: "numerical"
  shortcuts:
    "gRPC Pod Config":
      key: "g"
      helptext: "Show gRPC Pod Config"
      read_only: true
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "gRPC Pod Config"
        _pass_obj: true
        path: "spec#grpcPodConfig"
    "Registry Service":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for registry Service"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "Service"
        namespace_path: "status#registryService#serviceNamespace"
        name_path: "status#registryService#serviceName"
