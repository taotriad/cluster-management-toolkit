---
kind: "Sidecar"
api_family: "networking.istio.io"
default_command: "sidecars"
listview:
  name: "Sidecars"
  group: "Istio"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Sidecar Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["workload_label_selector", "outbound_traffic_policy"]
    rows:
      outbound_traffic_policy:
        header: [["Outbound Traffic Policy:", ["main", "infoheader"]]]
        path: "spec#outboundTrafficPolicy"
        default: "Default"
        type: "str"
      workload_label_selector:
        header: [["Workload La", ["main", "infoheader"]],
                 ["b", ["main", "infoheader_shortcut"]],
                 ["el Selector:", ["main", "infoheader"]]]
        paths:
          - path: ["spec#workloadSelector#labels"]
            pathtype: "key_value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      paths:
        - path: "spec#ingress"
          type: "list"
          key_name: "traffic_type"
          key_value: "Ingress"
        - path: "spec#egress"
          type: "list"
          key_name: "traffic_type"
          key_value: "Egress"
    infogetter: "generic_infogetter"
    on_activation:
      call: "resourceinfodispatch"
      kind: "__ResourceView"
      formatter: "format_yaml"
      obj_path: ""
      title: "Traffic Policy"
    field_indexes:
      Normal:
        fields: ["traffic_type", "port", "bind", "capture_mode",
                 "default_endpoint", "hosts"]
        sortcolumn: "traffic_type"
    fields:
      bind:
        header: "Bind:"
        path: "bind"
        default: "<none>"
        type: "str"
        formatter: "address"
      capture_mode:
        header: "Capture Mode:"
        path: "captureMode"
        default: "DEFAULT"
        type: "str"
      default_endpoint:
        header: "Default Endpoint:"
        path: "defaultEndpoint"
        default: "<none>"
        type: "str"
      hosts:
        header: "Hosts:"
        path: "hosts"
        type: "raw"
        formatter: "list"
      port:
        header: "Port:"
        paths:
          - path: [["port#name"], ["port#number"], ["port#protocol"]]
            pathtype: "tuple"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "service"
            - type: "port"
            - type: "protocol"
          field_separators:
            - type: "port"
            - type: "service"
      traffic_type:
        header: "Traffic Type:"
        path: "traffic_type"
        type: "str"
  shortcuts:
    "Workload Label Selector":
      key: "b"
      read_only: true
      helptext: "Show workload label selector"
      widget: "windowwidget"
      widget_args:
        title: "Workload Label Selector:"
        headers: ["Key:", "Value:"]
        itemgetter: "get_key_value"
        itemgetter_args:
          path: "spec#workloadSelector#labels"
