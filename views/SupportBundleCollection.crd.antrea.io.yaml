---
kind: "SupportBundleCollection"
api_family: "crd.antrea.io"
default_command: "supportbundlecollections"
listview:
  name: "Support Bundle Collections"
  group: "Antrea"
  field_indexes:
    Normal:
      fields: ["name", "collected", "age"]
  fields:
    collected:
      header: "Collected:"
      paths:
        - path: [["status#collectedNodes"], ["status#desiredNodes"]]
          pathtype: "tuple"
          default: ["0", "0"]
      formatter: "list"
      formatting:
        field_colors:
          - type: "numerical"
          - type: "numerical"
      align: "right"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Support Bundle Collection Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["nodes_header", "nodes_names",
                 "nodes_node_selector",
                 "external_nodes_header",
                 "external_nodes_names",
                 "external_nodes_namespace",
                 "external_nodes_node_selector",
                 "file_server",
                 "authentication_header", "authentication_secret",
                 "authentication_type", "expiration", "since"]
    rows:
      authentication_header:
        header: [["Authentication:", ["main", "infoheader"]]]
      authentication_secret:
        header: [["  ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["ecret:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#authentication#authSecret#namespace"],
                   ["spec#authentication#authSecret#name"]]
            pathtype: "tuple"
        formatter: "list"
        formatting:
          field_colors:
            - type: "namespace"
            - type: "generic"
          field_separators:
            - type: "namespace"
      authentication_type:
        header: [["  Type:", ["main", "infoheader"]]]
        path: "spec#authentication#authType"
        default: "<unset>"
        type: "str"
      collected:
        header: [["Collected:", ["main", "infoheader"]]]
        paths:
          - path: [["status#collectedNodes"], ["status#desiredNodes"]]
            pathtype: "tuple"
            default: ["0", "0"]
        formatter: "list"
      expiration:
        header: [["Expiration Time:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#expirationMinutes"], "m"]
            pathtype: "tuple"
        formatter: "list"
        formatting:
          field_colors:
            - type: "numerical"
            - type: "unit"
          field_separators:
            - type: "no_pad"
      external_nodes_header:
        header: [["External Nodes:", ["main", "infoheader"]]]
      external_nodes_node_selector:
        header: [["  ", ["main", "infoheader"]],
                 ["N", ["main", "infoheader_shortcut"]],
                 ["ode Selector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#externalNodes#nodeSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      external_nodes_names:
        header: [["  N", ["main", "infoheader"]],
                 ["o", ["main", "infoheader_shortcut"]],
                 ["de Names:", ["main", "infoheader"]]]
        path: "spec#externalNodes#nodeNames"
        default: ["<none>"]
        type: "raw"
        formatter: "list"
      external_nodes_namespace:
        header: [["  Namespace:", ["main", "infoheader"]]]
        path: "spec#externalNodes#namespace"
        default: "<unset>"
        type: "str"
        formatting:
          field_colors:
            - type: "namespace"
      file_server:
        header: [["File Server:", ["main", "infoheader"]]]
        path: "spec#fileServer#url"
        default: "<unset>"
        type: "str"
      nodes_header:
        header: [["Nodes:", ["main", "infoheader"]]]
      nodes_node_selector:
        header: [["  Node Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#nodes#nodeSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      nodes_names:
        header: [["  No", ["main", "infoheader"]],
                 ["d", ["main", "infoheader_shortcut"]],
                 ["e Names:", ["main", "infoheader"]]]
        path: "spec#nodes#nodeNames"
        default: ["<unset>"]
        type: "raw"
        formatter: "list"
      since:
        header: [["Since:", ["main", "infoheader"]]]
        path: "spec#sinceTime"
        default: "<unset>"
        type: "str"
        formatter: "age"
  shortcuts:
    "Node Selector":
      key: "t"
      read_only: true
      helptext: "Show Node selector"
      widget: "windowwidget"
      widget_args:
        title: "Node Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#nodes#nodeSelector"
    "External Node Selector":
      key: "n"
      modifier: "shift"
      read_only: true
      helptext: "Show external Node selector"
      widget: "windowwidget"
      widget_args:
        title: "External Node Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#externalNodes#nodeSelector"
    "Show Node list":
      key: "d"
      read_only: true
      helptext: "List Nodes"
      widget: "windowwidget"
      widget_args:
        title: "Nodes:"
        selectable: true
        itemgetter: "get_list_as_list"
        itemgetter_args:
          paths: ["spec#nodes#nodeNames"]
        # Not supported for now
        sortcolumn: "name"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        kind: "Node"
        name_path: 0
    "Show External Node list":
      key: "o"
      read_only: true
      helptext: "List External Nodes"
      widget: "windowwidget"
      widget_args:
        title: "Nodes:"
        selectable: true
        itemgetter: "get_list_as_list"
        itemgetter_args:
          paths: ["spec#externalNodes#nodeNames"]
        # Not supported for now
        sortcolumn: "name"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        kind: "ExternalNode"
        api_family: "crd.antrea.io"
        name_path: 0
        namespace_path: "spec#externalNodes#namespace"
    "Open Secret":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for Secret"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "Secret"
        namespace_path: "spec#authentication#authSecret#namespace"
        name_path: "spec#authentication#authSecret#name"
