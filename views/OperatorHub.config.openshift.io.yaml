---
kind: "OperatorHub"
api_family: "config.openshift.io"
default_command: "operatorhubs.config.openshift.io"
command:
  - "operatorhubs.config"
  - "operatorhub.config"
listview:
  name: "Operator Hubs"
  group: "OpenShift"
  field_indexes:
    Normal:
      fields: ["name", "age"]
infoview:
  name: "Operator Hub Info"
  infopad:
  shortcuts:
    "Show sources":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Show sources"
      widget: "windowwidget"
      widget_args:
        title: "Sources:"
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "status#sources"
          fields:
            - "name"
            - "status"
            - "disabled"
        headers: ["Name:", "Status:", "Disabled:"]
        # Not supported for now
        sortcolumn: "status"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      path: "status#sources"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["name", "disabled", "status"]
        sortcolumn: "status"
    fields:
      disabled:
        header: "Disabled:"
        path: "disabled"
        default: "<unset>"
        type: "str"
      name:
        header: "Name:"
        path: "name"
        default: "<unset>"
        type: "str"
      status:
        header: "Status:"
        path: "status"
        default: "<unset>"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              Success:
                field_colors:
                  - context: "main"
                    type: "status_ok"
