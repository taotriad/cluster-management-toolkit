---
kind: "SnippetsPolicy"
api_family: "gateway.nginx.org"
default_command: "snipperspolicies"
listview:
  name: "Snippets Policies"
  group: "Network"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Snippets Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["snippets", "targets"]
    rows:
      snippets:
        header: [["S", ["main", "infoheader_shortcut"]],
                 ["nippets:", ["main", "infoheader"]]]
        paths:
          - path: "spec#snippets"
            pathtype: "items"
            subpaths:
              - "context"
              - "value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
      targets:
        header: [["T", ["main", "infoheader_shortcut"]],
                 ["argets:", ["main", "infoheader"]]]
        paths:
          - path: "spec#targetRefs"
            pathtype: "items"
            subpaths:
              - "kind"
              - "group"
              - "name"
            type: ["kind", "api_group", "name"]
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      path: "status#ancestors"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["ancestor", "controller"]
        sortcolumn: "ancestor"
    fields:
      ancestor:
        header: "Ancestor:"
        paths:
          - path: [["ancestorRef#kind"],
                   ["ancestorRef#group"],
                   ["ancestorRef#namespace"],
                   ["ancestorRef#name"]]
            pathtype: "tuple"
            type: ["kind", "api_group", "name", "name"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "namespace"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
            - type: "namespace"
      controller:
        header: "Controller:"
        path: "controllerName"
        default: "<unset>"
        type: "str"
  shortcuts:
    "List Snippets":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "List snippets"
      widget: "windowwidget"
      widget_args:
        title: "Snippets:"
        headers: ["Snippet:", "Value:"]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#snippets"
          fields:
            - "context"
            - "value"
        # Not supported for now
        sortcolumn: "context"
    "List Targets":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "List targets"
      widget: "windowwidget"
      widget_args:
        title: "Targets:"
        selectable: true
        headers: ["Kind:", "API-Group:", "Name:"]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#targetRefs"
          fields:
            - "kind"
            - "group"
            - "name"
        # Not supported for now
        sortcolumn: "kind"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        kind_path: 0
        api_group_path: 1
        name_path: 2
        _parent_namespace_path: "metadata#namespace"
