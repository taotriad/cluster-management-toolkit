---
kind: "MigrationPolicy"
api_family: "migrations.kubevirt.io"
default_command: "migrationpolicies"
command:
  - "migrationpols"
  - "migrationpol"
listview:
  name: "Migration Policies"
  group: "Virtualization"
  field_indexes:
    Normal:
      fields: ["name", "age"]
infoview:
  name: "Migration Policy Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["allow_auto_converge", "allow_post_copy",
                 "bandwidth_per_migration", "completion_timeout_per_gib",
                 "selectors_header", "selectors_namespace_selector",
                 "selectors_virtual_machine_instance_selector"]
    rows:
      allow_auto_converge:
        header: [["Allow Auto Converge:", ["main", "infoheader"]]]
        path: "spec#allowAutoConverge"
        default: "<unset>"
        type: "bool"
      allow_post_copy:
        header: [["Allow Post Copy:", ["main", "infoheader"]]]
        path: "spec#allowPostCopy"
        default: "<unset>"
        type: "bool"
      bandwidth_per_migration:
        header: [["Bandwidth per Migration:", ["main", "infoheader"]]]
        path: "spec#bandwidthPerMigration"
        default: "<unset>"
        type: "str"
        formatter: "numerical"
      completion_timeout_per_gib:
        header: [["Completion Timeout per GiB:", ["main", "infoheader"]]]
        path: "spec#completionTimeoutPerGiB"
        default: "<unset>"
        type: "int"
        formatter: "numerical"
      selectors_header:
        header: [["Selectors:", ["main", "infoheader"]]]
      selectors_namespace_selector:
        header: [["  Namespace Selector:", ["main", "infoheader"]]]
        paths:
          - path: ["spec#selectors#namespaceSelector"]
            pathtype: "key_value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
      selectors_virtual_machine_instance_selector:
        header: [["  Virtual Machine Instance Selector:",
                  ["main", "infoheader"]]]
        paths:
          - path: ["spec#selectors#virtualMachineInstanceSelector"]
            pathtype: "key_value"
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "value"
          field_separators:
            - type: "selector"
