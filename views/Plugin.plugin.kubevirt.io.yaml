kind: "Plugin"
api_family: "plugin.kubevirt.io"
default_command: "plugins.plugins.kubevirt.io"
command:
  - "kvplugins"
  - "kvplugin"
listview:
  name: "Plugins"
  group: "Virtualization"
  field_indexes:
    Wide:
      fields: ["name", "age"]
infoview:
  name: "Plugin Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["failure_strategy", "condition"]
    rows:
      condition:
        header: [["Condition:", ["main", "infoheader"]]]
        path: "spec#condition"
        default: "<unset>"
        type: "str"
        formatter: "selector"
      failure_strategy:
        header: [["Failure Strategy:", ["main", "infoheader"]]]
        path: "spec#failureStrategy"
        default: "<unset>"
        type: "str"
  listpad:
    title: "Hooks / References:"
    listgetter: "listgetter_path"
    listgetter_args:
      paths:
        - path: "spec#mutatingAdmissionPolicies"
          key_name: "type"
          key_value: "MutatingAdmissionPolicy"
          type: "list"
        - path: "spec#mutatingAdmissionWebhooks"
          key_name: "type"
          key_value: "MutatingWebhookConfiguration"
          type: "list"
        - path: "spec#validatingAdmissionPolicies"
          key_name: "type"
          key_value: "ValidatingAdmissionPolicy"
          type: "list"
        - path: "spec#validatingAdmissionWebhooks"
          key_name: "type"
          key_value: "ValidatingWebhookConfiguration"
          type: "list"
        - path: "spec#domainHooks"
          key_name: "type"
          key_value: "DomainHook"
          type: "list"
        - path: "spec#nodeHooks"
          key_name: "type"
          key_value: "NodeHook"
          type: "list"
    infogetter: "generic_infogetter"
    on_activation:
      call: "resourceinfodispatch_with_lookup"
      kind_path: "type"
      api_family: "admissionregistration.k8s.io"
      name_path: "name"
    field_indexes:
      Normal:
        fields: ["type", "name", "socket", "permitted_hooks",
                 "failure_strategy", "timeout", "condition", "cel_expression"]
        sortcolumn: "type"
    fields:
      cel_expression:
        header: "CEL Expression:"
        path: "cel#expression"
        default: "<none>"
        type: "raw"
        formatter: "selector"
      condition:
        header: "Condition:"
        path: "spec#condition"
        default: "<none>"
        type: "raw"
        formatter: "selector"
      failure_strategy:
        header: "Failure Strategy:"
        path: "failureStrategy"
        default: "<unset>"
        type: "str"
      name:
        header: "Name:"
        path: "name"
        default: "<unset>"
        type: "str"
      permitted_hooks:
        header: "Permitted Hooks:"
        path: "permittedHooks"
        default: "<none>"
        type: "raw"
        formatter: "list"
      socket:
        header: "Socket:"
        paths:
          - path: ["socket", "sidecar#socketPath"]
            pathtype: "value"
        default: "<unset>"
        type: "str"
        formatting:
          field_colors:
            - type: "path"
      timeout:
        header: "Timeout:"
        path: "timeout"
        default: "<unset>"
        type: "str"
        formatter: "numerical"
      type:
        header: "Type:"
        path: "type"
        default: "<unset>"
        type: "str"
