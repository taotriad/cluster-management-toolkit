---
kind: "TCPRoute"
api_family: "gateway.networking.k8s.io"
default_command: "tcproutes"
listview:
  name: "TCP Routes"
  group: "Network"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "TCP Route Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["parent_refs"]
    rows:
      parent_refs:
        header: [["P", ["main", "infoheader_shortcut"]],
                 ["arent References:", ["main", "infoheader"]]]
        paths:
          - path: "spec#parentRefs"
            pathtype: "items"
            subpaths:
              - "kind"
              - "group"
              - "name"
            type: ["kind", "api_group", "name"]
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
  shortcuts:
    "List Parents":
      key: "p"
      modifier: "shift"
      read_only: true
      helptext: "List parents"
      widget: "windowwidget"
      widget_args:
        title: "Parents:"
        selectable: true
        headers: ["Kind:", "API-Group:", "Name:", "Section:"]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#parentRefs"
          fields:
            - "kind"
            - "group"
            - "name"
            - "sectionName"
        # Not supported for now
        sortcolumn: "kind"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        kind_path: 0
        api_group_path: 1
        name_path: 2
        _parent_namespace_path: "metadata#namespace"
    "Rules":
      key: "r"
      modifier: "shift"
      read_only: true
      helptext: "Show rules"
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "Rules"
        _pass_obj: true
        path: "spec#rules"
        include_root: true
