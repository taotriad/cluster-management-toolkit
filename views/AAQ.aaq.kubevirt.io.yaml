---
kind: "AAQ"
api_family: "aaq.kubevirt.io"
default_command: "aaqs"
listview:
  name: "AAQs"
  group: "Policy"
  field_indexes:
    Normal:
      fields: ["name", "phase", "age"]
  fields:
    phase:
      header: "Phase:"
      path: "status#phase"
      default: "<unset>"
      type: "str"
      formatter: "value_mapper"
      formatting:
        mapping:
          mappings:
            Deleting:
              field_colors:
                - context: "main"
                  type: "status_pending"
            Deleted:
              field_colors:
                - context: "main"
                  type: "status_done"
            Deployed:
              field_colors:
                - context: "main"
                  type: "status_done"
            Deploying:
              field_colors:
                - context: "main"
                  type: "status_pending"
            Error:
              field_colors:
                - context: "main"
                  type: "status_not_ok"
            Upgrading:
              field_colors:
                - context: "main"
                  type: "status_pending"
infoview:
  name: "AAQ Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["image_pull_policy",
                 "infrastructure_header",
                 "infrastructure_node_selector",
                 "infrastructure_tolerations",
                 "workload_header",
                 "workload_node_selector",
                 "version_header",
                 "version_observed",
                 "version_operator",
                 "version_target",
                 "phase"]
    rows:
      image_pull_policy:
        header: [["Image Pull Policy:", ["main", "infoheader"]]]
        path: "spec#imagePullPolicy"
        default: "<unset>"
        type: "str"
      infrastructure_header:
        header: [["Infrastructure:", ["main", "infoheader"]]]
      infrastructure_node_selector:
        header: [["  Node Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#infra#nodeSelector"
            pathtype: "obj"
            reparent: "matchLabels"
            default: "<none>"
        formatter: "selector"
      infrastructure_tolerations:
        header: [["  ", ["main", "infoheader"]],
                 ["T", ["main", "infoheader_shortcut"]],
                 ["olerations:", ["main", "infoheader"]]]
        paths:
          # FIXME: Pathtype toleration or obj, formatter toleration
          - path: "spec#infra#tolerations"
            pathtype: "match_expression"
            default: "<none>"
        formatter: "list"
        formatting:
          field_colors:
            - type: "key"
            - type: "operator"
            - type: "value"
          field_separators:
            - type: "space"
            - type: "no_pad"
      phase:
        header: [["Phase:", ["main", "infoheader"]]]
        path: "status#phase"
        default: "<unset>"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              Deleting:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Deleted:
                field_colors:
                  - context: "main"
                    type: "status_done"
              Deployed:
                field_colors:
                  - context: "main"
                    type: "status_done"
              Deploying:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Error:
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
              Upgrading:
                field_colors:
                  - context: "main"
                    type: "status_pending"
      version_header:
        header: [["Version:", ["main", "infoheader"]]]
      version_observed:
        header: [["  Observed:", ["main", "infoheader"]]]
        path: "status#observedVersion"
        default: "<unset>"
        type: "str"
        formatter: "version"
      version_operator:
        header: [["  Operator:", ["main", "infoheader"]]]
        path: "status#operatorVersion"
        default: "<unset>"
        type: "str"
        formatter: "version"
      version_target:
        header: [["  Target:", ["main", "infoheader"]]]
        path: "status#targetVersion"
        default: "<unset>"
        type: "str"
        formatter: "version"
      workload_header:
        header: [["Workload:", ["main", "infoheader"]]]
      workload_node_selector:
        header: [["  No", ["main", "infoheader"]],
                 ["d", ["main", "infoheader_shortcut"]],
                 ["e Selector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#workload#nodeSelector"
            pathtype: "obj"
            reparent: "matchLabels"
            default: "<none>"
        formatter: "selector"
  logpad:
    title: "Configuration:"
    infogetter: "logpad_formatted"
    infogetter_args:
      formatter: "format_yaml"
      path: "spec#configuration"
    timestamps: false
  shortcuts:
    "Infrastructure Node Selector":
      key: "t"
      read_only: true
      helptext: "Show Infrastructure Node selector"
      widget: "windowwidget"
      widget_args:
        title: "Infrastructure Node Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#infra#nodeSelector"
          reparent: "matchLabels"
    "Workload Node Selector":
      key: "d"
      read_only: true
      helptext: "Show Workload Node selector"
      widget: "windowwidget"
      widget_args:
        title: "Workload Node Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#workload#nodeSelector"
          reparent: "matchLabels"
    "Show Infrastructure tolerations":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "Show Infrastructure tolerations"
      widget: "windowwidget"
      widget_args:
        title: "Infrastructure Tolerations:"
        headers: ["Key:", "Operator:", "Value:", "Effect:", "Timeout:"]
        itemgetter: "get_tolerations"
        itemgetter_args:
          path: ["spec#infra#tolerations"]
        # This isn't supported for now
        sortcolumn: "key"
