---
kind: "CiliumNodeConfig"
api_family: "cilium.io"
default_command: "ciliumnodeconfigs"
command:
  - "ciliumnodeconfs"
  - "ciliumnodeconf"
listview:
  name: "Cilium Node Configs"
  group: "Cilium"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Cilium Node Config Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["node_selector", "default_ip_pool"]
    rows:
      default_ip_pool:
        header: [["Default Pod ", ["main", "infoheader"]],
                 ["I", ["main", "infoheader_shortcut"]],
                 ["P Pool:", ["main", "infoheader"]]]
        path: "spec#defaults#ipam-default-ip-pool"
        default: "<unset>"
        type: "str"
      node_selector:
        header: [["Node Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#nodeSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  shortcuts:
    "Default Pod IP Pool":
      key: "I"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for default IP pool"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "CiliumPodIPPool"
        api_family: "cilium.io"
        name_path: "spec#defaults#ipam-default-ip-pool"
    "Defaults":
      key: "d"
      modifier: "shift"
      read_only: true
      helptext: "Show defaults"
      widget: "windowwidget"
      widget_args:
        title: "Defaults:"
        headers: ["Key:", "Value:"]
        itemgetter: "get_key_value"
        itemgetter_args:
          path: "spec#defaults"
    "Node Selector":
      key: "t"
      read_only: true
      helptext: "Show Node selector"
      widget: "windowwidget"
      widget_args:
        title: "Node Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#nodeSelector"
