---
kind: "GrafanaDashboard"
api_family: "grafana.integreatly.org"
default_command: "grafanadashboards"
command:
  - "grafanadbs"
  - "grafanadb"
listview:
  name: "Grafana Dashboards"
  group: "Observability"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Grafana Dashboard Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["instance_selector", "allow_cross_namespace_import",
                 "resync_period"]
    rows:
      allow_cross_namespace_import:
        header: [["Allow Cross Namespace Import:", ["main", "infoheader"]]]
        path: "spec#allowCrossNamespaceImport"
        default: "<unset>"
        type: "bool"
      instance_selector:
        header: [["Instance Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#instanceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      resync_period:
        header: [["Resync Period:", ["main", "infoheader"]]]
        path: "spec#resyncPeriod"
        default: "<unset>"
        type: "str"
        formatter: "numerical"
  logpad:
    infogetter: "logpad_formatted"
    infogetter_args:
      formatter: "format_yaml"
      path: "spec#json"
    timestamps: false
  shortcuts:
    "Instance Selector":
      key: "b"
      read_only: true
      helptext: "Show instance selector"
      widget: "windowwidget"
      widget_args:
        title: "Instance Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#instanceSelector"
