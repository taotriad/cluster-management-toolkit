---
kind: "Operator"
api_family: "operators.coreos.com"
default_command: "operators"
listview:
  name: "Operators"
  group: "API & Extendability"
  field_indexes:
    Normal:
      fields: ["name", "references", "age"]
  fields:
    references:
      header: "References:"
      path: "status#components#refs"
      type: "len"
      formatter: "numerical"
      align: "right"
infoview:
  name: "Operator Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["label_selector"]
    rows:
      label_selector:
        header: [["La", ["main", "infoheader"]],
                 ["b", ["main", "infoheader_shortcut"]],
                 ["el Selector:", ["main", "infoheader"]]]
        paths:
          - path: ["status#components#labelSelector"]
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  shortcuts:
    "Label Selector":
      key: "b"
      read_only: true
      helptext: "Show label selector"
      widget: "windowwidget"
      widget_args:
        title: "Label Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "status#components#labelSelector"
    "List References":
      key: "r"
      modifier: "shift"
      read_only: true
      helptext: "List references"
      widget: "windowwidget"
      widget_args:
        title: "References:"
        headers: ["Kind:", "API-version:", "Namespace:", "Name:"]
        selectable: true
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "status#components#refs"
          fields:
            - "kind"
            - "apiVersion"
            - "namespace"
            - "name"
        # This isn't supported for now
        sortcolumn: "name"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        kind_path: 0
        api_version_path: 1
        namespace_path: 2
        name_path: 3
