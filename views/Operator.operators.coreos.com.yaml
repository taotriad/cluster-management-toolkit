---
kind: "Operator"
api_family: "operators.coreos.com"
default_command: "operators"
listview:
  name: "Operators"
  group: "API & Extendability"
  field_indexes:
    Normal:
      fields: ["name", "references", "age"]
  fields:
    references:
      header: "References:"
      path: "status#components#refs"
      type: "len"
      formatter: "numerical"
      align: "right"
  actions:
    actionlist:
      "Delete resource":
        description: "Delete resource"
        category: "Resource Level"
        confirm: true
        actionfunc: "delete_resource"
infoview:
  name: "Operator Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["label_selector"]
    rows:
      label_selector:
        header: [["La", ["main", "infoheader"]],
                 ["b", ["main", "infoheader_shortcut"]],
                 ["el Selector:", ["main", "infoheader"]]]
        paths:
          - path: ["status#components#labelSelector"]
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  listpad:
    on_activation:
      call: "resourceinfodispatch_with_lookup"
      kind_path: "kind"
      api_version_path: "apiVersion"
      name_path: "name"
      namespace_path: "namespace"
    listgetter: "listgetter_path"
    listgetter_args:
      path: "status#components#refs"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["namespace", "name", "kind", "status"]
        sortcolumn: "kind"
    fields:
      kind:
        header: "Kind:"
        paths:
          - path: [["kind"], ["apiVersion"]]
            pathtype: "tuple"
            type: ["kind", "kind"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
          field_separators:
            - type: "kind_api_group"
      name:
        header: "Name:"
        path: "name"
        type: "str"
      namespace:
        header: "Namespace:"
        path: "namespace"
        type: "str"
      status:
        header: "Status:"
        paths:
          - path: "conditions"
            pathtype: "items"
            subpath: "reason"
            limit: 1
            default: ["<unset>"]
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              AllCatalogSourcesHealthy:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              CatalogSourcesAdded:
                field_colors:
                  - context: "main"
                    type: "status_done"
              InstallComponentFailed:
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
              InstallSucceeded:
                field_colors:
                  - context: "main"
                    type: "status_done"
              MinimumReplicasAvailable:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              NoConflicts:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              RequirementsNotMet:
                field_colors:
                  - context: "main"
                    type: "status_warning"
              UnsupportedOperatorGroup:
                field_colors:
                  - context: "main"
                    type: "status_warning"
              "<unset>":
                field_colors:
                  - context: "types"
                    type: "unset"
  shortcuts:
    "Label Selector":
      key: "b"
      read_only: true
      helptext: "Show label selector"
      widget: "windowwidget"
      widget_args:
        title: "Label Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "status#components#labelSelector"
