---
kind: "MachineDeployment"
api_family: "cluster.x-k8s.io"
default_command: "machinedeployments"
command:
  - "machinedeploys"
  - "machinedeploy"
  - "machinedeps"
  - "machinedep"
  - "x-md"
listview:
  name: "Machine Deployments"
  group: "Cluster Configuration"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "cluster", "ready_replicas",
               "uptodate_replicas", "paused", "phase", "age", "version"]
      sortcolumn: "namespace"
  fields:
    cluster:
      header: "Cluster:"
      path: "spec#clusterName"
      default: "<none>"
      type: "str"
    paused:
      header: "Paused:"
      path: "spec#paused"
      default: false
      type: "bool"
    phase:
      header: "Phase:"
      path: "status#phase"
      type: "str"
      formatter: "value_mapper"
      formatting:
        mapping:
          mappings:
            ScalingDown:
              field_colors:
                - context: "main"
                  type: "status_pending"
            ScalingUp:
              field_colors:
                - context: "main"
                  type: "status_pending"
            Running:
              field_colors:
                - context: "main"
                  type: "status_ok"
            Failed:
              field_colors:
                - context: "main"
                  type: "status_not_ok"
            Unknown:
              field_colors:
                - context: "main"
                  type: "status_unknown"
    ready_replicas:
      header: "Ready Replicas:"
      paths:
        - path: ["status#readyReplicas", "status#replicas"]
          pathtype: "comparison"
          default: [0, 0]
      formatter: "value_mapper"
      formatting:
        mapping:
          ranges:
            - min: 0
              max: 1
              field_colors:
                - context: "main"
                  type: "status_ok"
            - min: -1
              max: 0
              field_colors:
                - context: "main"
                  type: "status_pending"
            - default: true
              field_colors:
                - context: "main"
                  type: "status_not_ok"
      align: "right"
    uptodate_replicas:
      header: "Up to Date:"
      paths:
        - path: ["status#upToDateReplicas",
                 "status#updatedReplicas"]
          pathtype: "value"
      default: 0
      type: "int"
      formatter: "numerical"
      align: "right"
    version:
      header: "Version:"
      path: "spec#template#spec#version"
      type: "str"
      formatter: "version"
infoview:
  name: "Machine Deployment Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["cluster", "selector",
                 "max_in_flight_remediations",
                 "replicas", "update_strategy", "template_header",
                 "template_machine_name",
                 "template_bootstrap", "template_infrastructure",
                 "phase"]
    rows:
      cluster:
        header: [["Cl", ["main", "infoheader"]],
                 ["u", ["main", "infoheader_shortcut"]],
                 ["ster:", ["main", "infoheader"]]]
        path: "spec#clusterName"
        default: "<none>"
        type: "str"
      max_in_flight_remediations:
        header: [["Max In Flight Remediations:", ["main", "infoheader"]]]
        path: "spec#remediation#maxInFlight"
        default: "ALL"
        type: "raw"
        formatter: "numerical"
      phase:
        header: [["Phase:", ["main", "infoheader"]]]
        path: "status#phase"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              ScalingDown:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              ScalingUp:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Running:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              Failed:
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
              Unknown:
                field_colors:
                  - context: "main"
                    type: "status_unknown"
      replicas:
        header: [["Replicas:", ["main", "infoheader"]]]
        paths:
          - path: [["status#replicas"],
                   " Desired",
                   ["status#upToDateReplicas"],
                   " Up to Date",
                   ["status#readyReplicas"],
                   " Ready"]
            pathtype: "tuple"
            default: [0, "", 0, "", 0, ""]
        formatter: "list"
        formatting:
          field_colors:
            - type: "numerical"
            - type: "generic"
            - type: "numerical"
            - type: "generic"
            - type: "numerical"
            - type: "generic"
          field_separators:
            - type: "no_pad"
            - type: "fraction_spaced"
            - type: "no_pad"
            - type: "fraction_spaced"
            - type: "no_pad"
      selector:
        header: [["Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      template_bootstrap:
        header: [["  B", ["main", "infoheader"]],
                 ["o", ["main", "infoheader_shortcut"]],
                 ["otstrap:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#template#spec#bootstrap#configRef#kind"],
                   ["spec#template#spec#bootstrap#configRef#apiVersion"],
                   ["spec#template#spec#bootstrap#configRef#name"]]
            pathtype: "tuple"
            type: ["kind", "api_group", "name"]
        default: "<none>"
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
      template_header:
        header: [["T", ["main", "infoheader_shortcut"]],
                 ["emplate:", ["main", "infoheader"]]]
      template_infrastructure:
        header: [["  ", ["main", "infoheader"]],
                 ["I", ["main", "infoheader_shortcut"]],
                 ["nfrastructure:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#template#spec#infrastructureRef#kind"],
                   ["spec#template#spec#infrastructureRef#apiVersion"],
                   ["spec#template#spec#infrastructureRef#name"]]
            pathtype: "tuple"
            type: ["kind", "api_group", "name"]
        default: "<none>"
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
      template_machine_name:
        header: [["  Machine Name:", ["main", "infoheader"]]]
        path: "spec#machineNaming#template"
        default: "`{{ .machineSet.name }}-{{ .random }}`"
        type: "str"
      update_strategy:
        header: [["Update Strategy:", ["main", "infoheader"]]]
        paths:
          - path: [["spec#rollout#strategy#type"],
                   " (", "Max Surge: ",
                   ["spec#rollout#strategy#rollingUpdate#maxSurge"],
                   "Max Unavailable: ",
                   ["spec#rollout#strategy#rollingUpdate#maxUnavailable"], ")"]
            pathtype: "tuple"
            when:
              - key: "spec#rollout#strategy#type"
                eq: "RollingUpdate"
          - path: [["spec#rollout#strategy#type"]]
            pathtype: "tuple"
            when:
              - key: "spec#rollout#strategy#type"
                eq: "Recreate"
        formatter: "list"
        formatting:
          field_colors:
            - type: "generic"
            - type: "generic"
            - context: "main"
              type: "infoheader"
            - type: "numerical"
            - context: "main"
              type: "infoheader"
            - type: "numerical"
            - type: "generic"
          field_separators:
            - type: "no_pad"
            - type: "no_pad"
            - type: "no_pad"
            - type: "list"
            - type: "no_pad"
            - type: "no_pad"
          field_formatters:
            - ""
            - ""
            - ""
            - "numerical_with_units"
            - ""
            - "numerical_with_units"
            - ""
  listpad:
    listgetter: "generic_listgetter"
    listgetter_args:
      _kind: "Machine"
      _api_family: "cluster.x-k8s.io"
      _label_selector_path: "spec#selector#matchLabels"
      _none_on_empty_selector: true
    infogetter: "generic_infogetter"
    on_activation:
      call: "resourceinfodispatch"
      kind: "Machine"
      api_family: "cluster.x-k8s.io"
    field_indexes:
      Wide:
        fields: ["namespace", "name", "controller",
                 "cluster", "node", "provider_id",
                 "phase", "age", "version"]
        sortcolumn: "namespace"
      Normal:
        fields: ["namespace", "name", "cluster", "phase", "age", "version"]
        sortcolumn: "namespace"
    fields:
      cluster:
        header: "Cluster:"
        path: "spec#clusterName"
        type: "str"
      controller:
        header: "Controller:"
        paths:
          - path: "metadata#ownerReferences"
            pathtype: "items"
            subpaths:
              - "kind"
              - "apiVersion"
              - "name"
            when:
              - key: "controller"
                eq: true
            type: ["kind", "api_group", "name"]
            default: ["<none>"]
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
      node:
        header: "Node:"
        path: "status#nodeRef#name"
        default: "<none>"
        type: "host"
        formatting:
          field_colors:
            - type: "host"
      phase:
        header: "Phase:"
        path: "status#phase"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              Pending:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Provisioned:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              Provisioning:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Running:
                field_colors:
                  - context: "main"
                    type: "status_ok"
              Terminating:
                field_colors:
                  - context: "main"
                    type: "status_pending"
              Failed:
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
      provider_id:
        header: "Provider ID:"
        path: "spec#providerID"
        default: "<unset>"
        type: "str"
      version:
        header: "Version:"
        path: "spec#version"
        default: "<unset>"
        type: "str"
        formatter: "version"
  shortcuts:
    "View Machine Template":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "Show Machine template"
      action: "call"
      action_call: "view_yaml"
      action_args:
        title: "Machine Template"
        _named_title: true
        _pass_obj: true
        path: "spec#template"
    "Selector":
      key: "t"
      read_only: true
      helptext: "Show selector"
      widget: "windowwidget"
      widget_args:
        title: "Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#selector"
    "Open Cluster":
      key: "u"
      read_only: true
      helptext: "Open info page for Cluster"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "Cluster"
        api_family: "cluster.x-k8s.io"
        namespace_path: "metadata#namespace"
        name_path: "spec#clusterName"
    "Open bootstrap":
      key: "o"
      read_only: true
      helptext: "Open info page for bootstrap"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        api_version_path: "spec#template#spec#bootstrap#configRef#apiVersion"
        kind_path: "spec#template#spec#bootstrap#configRef#kind"
        namespace_path: "metadata#namespace"
        name_path: "spec#template#spec#bootstrap#configRef#name"
    "Open infrastructure":
      key: "i"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for infrastructure"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        api_version_path: "spec#template#spec#infrastructureRef#apiVersion"
        kind_path: "spec#template#spec#infrastructureRef#kind"
        namespace_path: "metadata#namespace"
        name_path: "spec#template#spec#infrastructureRef#name"
