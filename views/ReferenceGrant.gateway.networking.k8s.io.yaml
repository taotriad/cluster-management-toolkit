---
kind: "ReferenceGrant"
api_family: "gateway.networking.k8s.io"
default_command: "referencegrants"
command:
  - "refgrants"
  - "refgrant"
listview:
  name: "Reference Grants"
  group: "Network"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Reference Grant Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["from", "to"]
    rows:
      from:
        header: [["From:", ["main", "infoheader"]]]
        paths:
          - path: "spec#from"
            pathtype: "items"
            subpaths:
              - "kind"
              - "group"
              - "namespace"
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "namespace"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
      to:
        header: [["T", ["main", "infoheader_shortcut"]],
                 ["o:", ["main", "infoheader"]]]
        paths:
          - path: "spec#to"
            pathtype: "items"
            subpaths:
              - "kind"
              - "group"
              - "name"
        formatter: "list"
        formatting:
          field_colors:
            - type: "kind"
            - type: "api_group"
            - type: "generic"
          field_separators:
            - type: "kind_api_group"
            - type: "kind"
  shortcuts:
    "List Destinations":
      key: "t"
      modifier: "shift"
      read_only: true
      helptext: "List destinations"
      widget: "windowwidget"
      widget_args:
        title: "Destinations:"
        selectable: true
        headers: ["Kind:", "API-group:", "Name:"]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#to"
          fields:
            - "kind"
            - "group"
            - "name"
        # Not supported for now
        sortcolumn: "kind"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        kind_path: 0
        api_group_path: 1
        name_path: 2
        _parent_namespace_path: "metadata#namespace"
