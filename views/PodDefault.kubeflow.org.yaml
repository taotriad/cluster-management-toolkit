---
kind: "PodDefault"
api_family: "kubeflow.org"
default_command: "poddefaults"
listview:
  name: "Pod Defaults"
  group: "Kubeflow"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Pod Default Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["description", "selector", "service_account"]
    rows:
      description:
        header: [["Description:", ["main", "infoheader"]]]
        path: "spec#desc"
        type: "str"
      selector:
        header: [["Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
      service_account:
        header: [["S", ["main", "infoheader_shortcut"]],
                 ["ervice Account:", ["main", "infoheader"]]]
        path: "spec#serviceAccountName"
        type: "str"
  shortcuts:
    "Selector":
      key: "t"
      read_only: true
      helptext: "Show selector"
      widget: "windowwidget"
      widget_args:
        title: "Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#selector"
    "Environment Variables":
      key: "e"
      modifier: "shift"
      read_only: true
      helptext: "List environment variables"
      widget: "windowwidget"
      widget_args:
        title: "Environment Variables:"
        headers: ["Key:", "Value:"]
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#env"
          fields:
            - "name"
            - "value"
        # Not supported for now
        sortcolumn: "name"
    "Service Account":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Open info page for Service Account"
      action: "call"
      action_call: "resourceinfodispatch_with_lookup"
      action_args:
        _pass_obj: true
        kind: "ServiceAccount"
        name_path: "spec#serviceAccountName"
        namespace_path: "metadata#namespace"
