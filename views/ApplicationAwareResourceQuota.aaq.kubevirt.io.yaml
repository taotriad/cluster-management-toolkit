---
kind: "ApplicationAwareResourceQuota"
api_family: "aaq.kubevirt.io"
default_command: "applicationawareresourcequotas"
command:
  - "aaquotas"
  - "aaquota"
  - "aarqs"
  - "aarq"
listview:
  name: "Application Aware Resource Quotas"
  group: "Policy"
  field_indexes:
    Wide:
      fields: ["namespace", "name", "age", "request", "limit"]
      sortcolumn: "namespace"
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
  fields:
    limit:
      header: "Limit:"
      paths:
        - path: "spec#hard"
          pathtype: "key_value"
          when:
            - key_startswith: "limits."
      formatter: "list"
      formatting:
        field_colors:
          - type: "key"
          - type: "numerical"
        field_separators:
          - type: "keyvalue"
        field_formatters:
          - ""
          - "numerical_with_units"
    request:
      header: "Request:"
      paths:
        - path: "spec#hard"
          pathtype: "key_value"
          when:
            - key_notstartswith: "limits."
      formatter: "list"
      formatting:
        field_colors:
          - type: "key"
          - type: "numerical"
        field_separators:
          - type: "keyvalue"
        field_formatters:
          - ""
          - "numerical_with_units"
infoview:
  name: "Application Aware Resource Quota Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["scope_selector"]
    rows:
      scope_selector:
        header: [["Scope Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#scopeSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      path: ""
    infogetter: "get_rq_item_info"
    field_indexes:
      Normal:
        fields: ["resource", "used", "hard"]
    fields:
      hard:
        header: "Hard:"
        path: "hard"
        type: "str"
        formatter: "numerical"
        align: "right"
      resource:
        header: "Resource:"
        path: "resource"
        type: "str"
      used:
        header: "Used:"
        path: "used"
        type: "str"
        formatter: "numerical"
        align: "right"
  shortcuts:
    "Scope Selector":
      key: "t"
      read_only: true
      helptext: "Show scope selector"
      widget: "windowwidget"
      widget_args:
        title: "Scope Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#scopeSelector"
