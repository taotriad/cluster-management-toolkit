---
kind: "PodMonitor"
api_family: "monitoring.coreos.com"
default_command: "podmonitors"
command:
  - "podmons"
  - "podmon"
listview:
  name: "Pod Monitors"
  group: "Observability"
  field_indexes:
    Normal:
      fields: ["namespace", "name", "age"]
      sortcolumn: "namespace"
infoview:
  name: "Pod Monitor Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["job_label", "selector", "namespace_selector",
                 "attach_metadata_header", "attach_metadata_node"]
    rows:
      attach_metadata_header:
        header: [["Attach Metadata:", ["main", "infoheader"]]]
      attach_metadata_node:
        header: [["  Node:", ["main", "infoheader"]]]
        path: "spec#attachMetadata#node"
        type: "bool"
        default: false
      job_label:
        header: [["Job Label:", ["main", "infoheader"]]]
        path: "spec#jobLabel"
        default: "<unset>"
        type: "str"
      namespace_selector:
        header: [["Namespace Selector:", ["main", "infoheader"]]]
        path: "spec#namespaceSelector#matchNames"
        default: ["<unset>"]
        type: "raw"
        formatter: "list"
      selector:
        header: [["Selec", ["main", "infoheader"]],
                 ["t", ["main", "infoheader_shortcut"]],
                 ["or:", ["main", "infoheader"]]]
        paths:
          - path: "spec#selector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  shortcuts:
    "Selector":
      key: "t"
      read_only: true
      helptext: "Show selector"
      widget: "windowwidget"
      widget_args:
        title: "Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#selector"
    "Pod Monitor Endpoints":
      key: "e"
      modifier: "shift"
      read_only: true
      helptext: "List Pod Monitor endpoints"
      widget: "windowwidget"
      widget_args:
        title: "Pod Monitor Endpoints:"
        headers: ["Endpoint:", "Port:"]
        selectable: true
        itemgetter: "get_list_fields"
        itemgetter_args:
          path: "spec#podMetricsEndpoints"
          fields:
            - value: "index"
              index_template: "endpoint-<<<index>>>"
            - "port"
          pass_ref: true
        # This isn't supported for now
        sortcolumn: "namespace"
      action: "call"
      action_call: "resourceinfodispatch_from_selection"
      action_args:
        kind: "__PodMonitorEndpoint"
        api_family: "monitoring.coreos.com"
