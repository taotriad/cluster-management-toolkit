---
kind: "__InfraAssessmentReportData"
api_family: "aquasecurity.github.io"
default_command: "__"
infoview:
  name: "Infra Assessment Report Data"
  infopad:
    name_path: null
    creation_timestamp_path: null
    row_indexes:
      Normal:
        fields: ["test_case", "check_id", "description", "category",
                 "messages",
                 "severity", "result"]
    rows:
      category:
        header: [["Category:", ["main", "infoheader"]]]
        path: "category"
        type: "str"
      check_id:
        header: [["ID:", ["main", "infoheader"]]]
        path: "checkID"
        type: "str"
      description:
        header: [["D", ["main", "infoheader_shortcut"]],
                 ["escription:", ["main", "infoheader"]]]
        path: "description"
        type: "str"
      messages:
        header: [["Messa", ["main", "infoheader"]],
                 ["g", ["main", "infoheader_shortcut"]],
                 ["es:", ["main", "infoheader"]]]
        path: "messages"
        default: ["<none>"]
        type: "raw"
        formatter: "list"
        formatting:
          field_separators:
            - type: "list_semicolon"
      result:
        header: [["Result:", ["main", "infoheader"]]]
        paths:
          - path: "success"
            pathtype: "remap"
            substitutions:
              __True: "Success"
              __False: "Fail"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              "Success":
                field_colors:
                  - context: "main"
                    type: "status_ok"
              "Fail":
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
      severity:
        header: [["Severity:", ["main", "infoheader"]]]
        paths:
          - path: "severity"
            pathtype: "remap"
            substitutions:
              "CRITICAL": "Critical"
              "HIGH": "High"
              "LOW": "Low"
              "MEDIUM": "Medium"
            when:
              - key: "totalFail"
                gt: 0
        default: "Unaffected"
        type: "str"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              "Critical":
                index: 0
                field_colors:
                  - context: "main"
                    type: "severity_critical"
              "High":
                index: 1
                field_colors:
                  - context: "main"
                    type: "severity_high"
              "Low":
                index: 4
                field_colors:
                  - context: "main"
                    type: "status_admin"
              "Medium":
                index: 2
                field_colors:
                  - context: "main"
                    type: "severity_medium"
              "Unaffected":
                index: 5
                field_colors:
                  - context: "main"
                    type: "status_ok"
      test_case:
        header: [["Test Case:", ["main", "infoheader"]]]
        path: "title"
        type: "str"
  logpad:
    title: "Remediation:"
    infogetter: "logpad_formatted"
    infogetter_args:
      path: "remediation"
    timestamps: false
  shortcuts:
    "Show Description":
      key: "d"
      modifier: "shift"
      read_only: true
      helptext: "Show description"
      widget: "windowwidget"
      widget_args:
        title: "Description"
        # If the data is one single line we reformat it.
        wrap_lines: true
        itemgetter: "get_strings_from_string"
        itemgetter_args:
          path: "description"
    "List Messages":
      key: "g"
      read_only: true
      helptext: "List messages"
      widget: "windowwidget"
      widget_args:
        title: "Messages:"
        itemgetter: "get_list_as_list"
        itemgetter_args:
          path: "messages"
        # This isn't supported for now
        sortcolumn: "message"
