---
kind: "CiliumLoadBalancerIPPool"
api_family: "cilium.io"
default_command: "ciliumloadbalancerippools"
command:
  - "lbippools"
  - "lbippool"
listview:
  name: "Cilium Load Balancer IP Pools"
  group: "Cilium"
  field_indexes:
    Normal:
      fields: ["name", "disabled", "age"]
  fields:
    disabled:
      header: "Disabled:"
      path: "spec#disabled"
      default: false
      type: "bool"
      formatter: "value_mapper"
      formatting:
        mapping:
          mappings:
            "False":
              field_colors:
                - context: "main"
                  type: "status_ok"
            "True":
              field_colors:
                - context: "main"
                  type: "status_ignored"
infoview:
  name: "Cilium Load Balancer IP Pool Info"
  infopad:
    row_indexes:
      Normal:
        fields: ["service_selector", "disabled"]
    rows:
      disabled:
        header: [["Disabled:", ["main", "infoheader"]]]
        path: "spec#disabled"
        default: false
        type: "bool"
        formatter: "value_mapper"
        formatting:
          mapping:
            mappings:
              "false":
                field_colors:
                  - context: "main"
                    type: "status_ok"
              "true":
                field_colors:
                  - context: "main"
                    type: "status_not_ok"
      service_selector:
        header: [["Service ", ["main", "infoheader"]],
                 ["S", ["main", "infoheader_shortcut"]],
                 ["elector:", ["main", "infoheader"]]]
        paths:
          - path: "spec#serviceSelector"
            pathtype: "obj"
            default: "<none>"
        formatter: "selector"
  listpad:
    listgetter: "listgetter_path"
    listgetter_args:
      path: "spec#blocks"
    infogetter: "generic_infogetter"
    field_indexes:
      Normal:
        fields: ["cidr", "start", "stop"]
        sortcolumn: "cidr"
    fields:
      cidr:
        header: "CIDR:"
        path: "cidr"
        default: "<none>"
        type: "str"
        formatter: "address"
      start:
        header: "Start:"
        path: "start"
        default: "<none>"
        type: "str"
        formatter: "address"
      stop:
        header: "Stop:"
        path: "stop"
        default: "<none>"
        type: "str"
        formatter: "address"
  shortcuts:
    "Service Selector":
      key: "s"
      modifier: "shift"
      read_only: true
      helptext: "Show Service selector"
      widget: "windowwidget"
      widget_args:
        title: "Service Selector:"
        itemgetter: "get_selector_list"
        itemgetter_args:
          path: "spec#serviceSelector"
