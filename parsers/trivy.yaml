---
- name: "trivy"
  show_in_selector: false
  matchkeys:
    - image_name: "/aquasec/trivy-operator"
  parser_rules:
    - name: "ts_8601"
    - name: "glog"
    - name: "json"
      options:
        error:
          keys:
            - "error"
            - "status.reason"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
- name: "trivy"
  show_in_selector: false
  matchkeys:
    - pod_name: "scan-vulnerabilityreport"
      container_type: "InitContainer"
  parser_rules:
    - name: "strip_ansicodes"
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        regex: '^\s*([A-Z]{4})\s+(.*)'
        severity:
          field: 1
          transform: "4letter"
        message:
          field: 2
- name: "trivy"
  show_in_selector: false
  matchkeys:
    - image_name: "/aquasec/trivy"
      container_name: "copybins"
    - image_name: "/aquasec/trivy"
      container_name: "driver-registrar"
    - image_name: "/aquasec/trivy"
      container_name: "make-container-crash-dir"
    - image_name: "/aquasec/trivy"
      container_name: "init-copy-binaries"
  parser_rules:
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        regex: '^\s*([A-Z]+)\s+(.*)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
