---
- name: "cluster-logging-operator"
  show_in_selector: false
  matchkeys:
    - image_name: "/openshift-logging/cluster-logging"
  parser_rules:
    - name: "glog"
    - name: "json"
      options:
        timestamp:
          keys:
            - "_ts"
        # FIXME: At the moment we don't know what the levels represent.
        severity:
          default: info
        # keys:
        #   - "_level"
        message:
          keys:
            - "_message"
        facility:
          keys:
            - "_component"
        version:
          keys:
            - "_operator_version"
