---
- name: "kong"
  show_in_selector: false
  matchkeys:
    - pod_name: "ingress-kong"
  parser_rules:
    - name: "glog"
    - name: "key_value"
      options:
        allow_bare_keys: "lowercase"
        version:
          keys:
            - "release"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Error: "
              loglevel: "error"
- name: "kong"
  show_in_selector: false
  matchkeys:
    - pod_name: "proxy-kong"
  parser_rules:
    - name: "http"
