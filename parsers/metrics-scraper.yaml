---
- name: "metrics-scraper"
  show_in_selector: false
  matchkeys:
    - pod_name: "dashboard-metrics-scraper"
    - pod_name: "kubernetes-metrics-scraper"
  parser_rules:
    - name: "json"
    - name: "http"
      options:
        timestamp:
          reformat: true
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Kubernetes host:"
              loglevel: "notice"
- name: "metrics-scraper"
  show_in_selector: false
  matchkeys:
    - image_name: "/deckhouse/ce/modules/dashboard"
      container_name: "metrics-scraper"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
    - name: "http"
