---
- name: "loft"
  show_in_selector: false
  matchkeys:
    - pod_name: "loft"
  parser_rules:
    - name: "glog"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "match"
            matchkey: "(.+ with policy: )({)$"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: "}"
            format_block_end: true
        formatter: "reformat_json"
- name: "loft"
  show_in_selector: false
  matchkeys:
    - image_name: "/loftsh/cluster-api-provider-vcluster"
  parser_rules:
    - name: "glog"
    - name: "tab_separated"
