---
- name: "cert-manager"
  show_in_selector: false
  matchkeys:
    - image_name: "/jetstack/cert-manager-controller"
    - image_name: "/jetstack/cert-manager-cainjector"
    - image_name: "/jetstack/cert-manager-webhook"
    - pod_name: "cert-manager"
      container_name: "cert-manager"
      image_name: "/deckhouse/ce"
    - pod_name: "webhook"
      container_name: "webhook"
      image_name: "/deckhouse/ce"
    - pod_name: "cm-acme-http-solver"
      container_name: "acmesolver"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "\"starting\" version"
              loglevel: "notice"
            - matchtype: "regex"
              matchkey: 'cert-manager.*starting controller.*version'
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
            - matchtype: "startswith"
              matchkey: "http: TLS handshake"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "\"http: TLS handshake"
              loglevel: "error"
