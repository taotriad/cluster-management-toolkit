---
- name: "machine-config-controller"
  show_in_selector: false
  matchkeys:
    - container_name: "machine-config-"
    - container_name: "oauth-proxy"
  parser_rules:
    - name: "glog"
    - name: "custom_splitter"
      options:
        regex: '^\d{4}/\d\d/\d\d \d\d:\d\d:\d\d ([^:]+:[^:]+): (.*)'
        facility:
          fields:
            - 1
        message:
          field: 2
    - name: "custom_splitter"
      options:
        regex: '^\[\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ\s+([^\s]+)\s+([^]]+)] (.*)'
        severity:
          field: 1
          transform: "str"
        facility:
          fields:
            - 2
        message:
          field: 3
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "CoreOS aleph version:"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: "}"
            format_block_end: true
        formatter: "reformat_json"
    - name: "expand_event"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Version:"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "Nmstate version:"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
            - matchtype: "startswith"
              matchkey: "Error syncing "
              loglevel: "error"
    - name: "key_value_with_leading_message"
