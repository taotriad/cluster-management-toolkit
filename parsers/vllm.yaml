---
- name: "vllm"
  show_in_selector: false
  matchkeys:
    - image_name: "/intel/vllm"
  parser_rules:
    - name: "custom_splitter"
      options:
        regex: '([A-Z]+) \d\d-\d\d \d\d:\d\d:\d\d \[([^]]+)\] (.*)'
        severity:
          field: 1
          transform: "str"
        facility:
          fields:
            - 2
        message:
          field: 3
    - name: "custom_splitter"
      options:
        regex: '(/.+?:\d+:) (.*)'
        facility:
          fields:
            - 1
        message:
          field: 2
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "Traceback (most recent call last):"
            matchline: "any"
            format_block_start: true
          - matchtype: "startswith"
            # yamllint disable-line rule:line-length
            matchkey: "During handling of the above exception, another exception occurred:"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "match"
            # yamllint disable-line rule:line-length
            matchkey: '(\S+?Error|\S+?Exception|GeneratorExit|KeyboardInterrupt|Stop.*?Iteration|SystemExit|socket.gaierror|UserWarning|SyntaxWarning): '
            format_block_end: true
        formatter: "format_python_traceback"
- name: "vllm"
  show_in_selector: false
  matchkeys:
    - image_name: "/vllm/vllm-openai"
  parser_rules:
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\((\S+) pid=\d+\) ([A-Z]+) \d\d-\d\d \d\d:\d\d:\d\d \[(.+?:\d+)(\]$|\] )(.*)'
        severity:
          field: 2
          transform: "str"
        facility:
          fields:
            - 1
            - 3
          separators:
            - ":"
        message:
          field: 5
    - name: "custom_splitter"
      options:
        regex: '\((\S+) pid=\d+\) (Warning|INFO):\s+(.*)'
        facility:
          fields:
            - 1
        severity:
          field: 2
          transform: "str"
        message:
          field: 3
    - name: "custom_splitter"
      options:
        regex: '\[(.+?)\]:\[([A-Z])\d+ \d\d:\d\d:\d\d.\d+ (.+?:\d+)\] (.*)'
        facility:
          fields:
            - 1
            - 3
        severity:
          field: 2
          transform: "letter"
        message:
          field: 4
    # If we're not getting any severity or facility we still at least want to
    # extract the log message.
    - name: "custom_splitter"
      options:
        regex: '\((\S+) pid=\d+\) (.*)'
        facility:
          fields:
            - 1
        message:
          field: 2
    # And if we're not even getting any message either at least we want
    # to format the empty message properly...
    - name: "custom_splitter"
      options:
        regex: '\((\S+) pid=\d+\)()$'
        facility:
          fields:
            - 1
        message:
          field: 2
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "Traceback (most recent call last):"
            matchline: "any"
            format_block_start: true
          - matchtype: "startswith"
            # yamllint disable-line rule:line-length
            matchkey: "During handling of the above exception, another exception occurred:"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "match"
            # yamllint disable-line rule:line-length
            matchkey: '(\S+?Error|\S+?Exception|GeneratorExit|KeyboardInterrupt|Stop.*?Iteration|SystemExit|socket.gaierror|UserWarning|SyntaxWarning): '
            format_block_end: true
        formatter: "format_python_traceback"
        # yamllint disable-line rule:line-length
        regex: '\(\S+ pid=\d+\) [A-Z]+ \d\d-\d\d \d\d:\d\d:\d\d \[.+?:\d+\] (.*)|^\(\S+ pid=\d+\) (.*)'
- name: "vllm"
  show_in_selector: false
  matchkeys:
    - image_name: "/lmcache/lmstack-router"
  parser_rules:
    - name: "strip_ansicodes"
    - name: "custom_splitter"
      options:
        regex: '^(\[\d{4}-\d\d-\d\d \d\d:\d\d:\d\d.\d+] |)([A-Z]+?):\s*(.*)'
        severity:
          field: 2
          transform: "str"
        message:
          field: 3
