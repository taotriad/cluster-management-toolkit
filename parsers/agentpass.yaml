---
- name: "agentpass"
  show_in_selector: false
  matchkeys:
    - image_name: "/razashariff/agentmesh-webhook"
  parser_rules:
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\[([^]]+)\] (.*)'
        facility:
          fields:
            - 1
        message:
          field: 2
