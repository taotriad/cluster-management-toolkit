---
- name: "neuvector"
  show_in_selector: false
  matchkeys:
    - image_name: "/neuvector/controller"
      container_name: "neuvector-cert-upgrader-pod"
    - image_name: "/neuvector/controller"
      container_name: "init"
      container_type: "InitContainer"
  parser_rules:
    - name: "key_value"
- name: "neuvector"
  show_in_selector: false
  matchkeys:
    - image_name: "/neuvector/scanner"
      container_name: "neuvector-scanner-pod"
    - image_name: "/neuvector/manager"
      container_name: "neuvector-manager-pod"
    - image_name: "/neuvector/controller"
      container_name: "neuvector-controller-pod"
    - image_name: "/neuvector/enforcer"
      container_name: "neuvector-enforcer-pod"
  parser_rules:
    - name: "json"
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{1,3}\s{0,2}\|([A-Z]{4})\|(\S{3})\|(.*)'
        severity:
          field: 1
          transform: "4letter"
        facility:
          fields:
            - 2
        message:
          field: 3
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\|([A-Z]{4})\|(\S{3})\|(.*)'
        severity:
          field: 1
          transform: "4letter"
        facility:
          fields:
            - 2
        message:
          field: 3
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\|([A-Z]{4})\|\|(.*)'
        severity:
          field: 1
          transform: "4letter"
        message:
          field: 2
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\d{4}-\d\d-\d\d \d\d:\d\d:\d\d,\d{3}\|([A-Z]+)\s*\|([A-Z]+)\|(.*)'
        severity:
          field: 1
          transform: "str"
        facility:
          fields:
            - 2
        message:
          field: 3
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\|([A-Z]{3})\|(.*)'
        facility:
          fields:
            - 1
        message:
          field: 2
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z \[([A-Z]+)\] (.*)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "==> Starting Consul agent"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "match"
            matchkey: '\d\d\d\d-\d\d-\d\d'
            format_block_end: false
        severity:
          default: "notice"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "main.main: START - version="
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "RTNETLINK answers: Invalid argument"
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "Error leaving"
              loglevel: "error"
