---
- name: "jaeger"
  show_in_selector: false
  matchkeys:
    - pod_name: "jaeger"
      container_name: "jaeger-operator"
  parser_rules:
    - name: "glog"
    - name: "tab_separated"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "error getting"
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
- name: "jaeger-tracing"
  show_in_selector: false
  matchkeys:
    - image_name: "/jaegertracing/jaeger"
  parser_rules:
    - name: "tab_separated"
    - name: "ts_8601"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "application version: "
              loglevel: "notice"
- name: "jaeger-tracing"
  show_in_selector: false
  matchkeys:
    - pod_name: "jaeger-query"
      container_type: "InitContainer"
    - pod_name: "jaeger-collector"
      container_type: "InitContainer"
    - pod_name: "istio-tracing"
      container_name: "jaeger"
    - pod_name: "jaeger"
      container_name: "jaeger"
    - container_name: "jaeger"
      image_name: "/jaegertracing"
  parser_rules:
    - name: "strip_ansicodes"
    - name: "ts_8601"
    - name: "json"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "******************"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "startswith"
            matchkey: "******************"
            format_block_end: true
        severity:
          default: "info"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "application version: "
              loglevel: "notice"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "Traceback (most recent call last):"
            matchline: "any"
            format_block_start: true
          - matchtype: "startswith"
            # yamllint disable-line rule:line-length
            matchkey: "During handling of the above exception, another exception occurred:"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "regex"
            # yamllint disable-line rule:line-length
            matchkey: '^(\S+?Error|\S+?Exception|GeneratorExit|KeyboardInterrupt|Stop.*?Iteration|SystemExit|socket.gaierror|UserWarning|SyntaxWarning): '
            format_block_end: true
        formatter: "format_python_traceback"
