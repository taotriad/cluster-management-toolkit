---
- name: "rancher-monitoring"
  show_in_selector: false
  matchkeys:
    - container_name: "grafana-proxy"
    - container_name: "prometheus-proxy"
  parser_rules:
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '(^.+?\.sh): (info: |)(.*)'
        facility:
          fields:
            - 1
        message:
          field: 3
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '\d{4}/\d\d/\d\d \d\d:\d\d:\d\d \[([^]]+)\] (\d+#\d+): (.*)'
        facility:
          fields:
            - 2
        severity:
          field: 1
          transform: "str"
        message:
          field: 3
