---
- name: "nginx"
  show_in_selector: false
  matchkeys:
    - image_name: "/library/nginx"
    - image_name: "/nginxinc/nginx-unprivileged"
  parser_rules:
    - name: "colon_facility"
    - name: "ts_8601"
    - name: "bracketed_severity"
    - name: "http"
      options:
        reformat_timestamps: true
- name: "nginx"
  show_in_selector: false
  matchkeys:
    - image_name: "/nginx/nginx-gateway-fabric"
    - image_name: "/nginx/nginx-gateway-fabric"
      container_type: "InitContainer"
  parser_rules:
    - name: "json"
      options:
        versions:
          - "version"
    - name: "override_severity"
      overrides:
        - matchtype: "startswith"
          matchkey: "Starting the NGINX Gateway Fabric"
          loglevel: "notice"
