---
- name: "starboard"
  show_in_selector: false
  matchkeys:
    - pod_name: "starboard-operator"
    - image_name: "/aquasec/kube-hunter"
  parser_rules:
    - name: "glog"
    - name: "json"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Starting operator"
              loglevel: "notice"
- name: "starboard"
  show_in_selector: false
  matchkeys:
    - image_name: "aquasec/trivy"
      container_type: "InitContainer"
  parser_rules:
    - name: "strip_ansicodes"
    - name: "custom_splitter"
      options:
        regex: '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d.\d{6}Z\s\s([A-Z]{4})\s(.*)$'
        severity:
          field: 1
          transform: "4letter"
        message:
          field: 2
- name: "starboard"
  show_in_selector: false
  matchkeys:
    - image_name: "aquasec/trivy"
    - image_name: "/fairwinds/polaris"
  parser_rules:
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            matchkey: "{"
            matchline: "any"
            format_block_start: true
          - matchtype: "startswith"
            matchkey: "  "
            matchline: "first"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: "}"
            format_block_end: true
        formatter: "reformat_json"
