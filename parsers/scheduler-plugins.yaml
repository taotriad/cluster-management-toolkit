---
- name: "scheduler-plugins"
  show_in_selector: false
  matchkeys:
    - pod_name: "scheduler-plugins"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
            - matchtype: "startswith"
              matchkey: "Version: v"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "\"Starting Kubernetes Scheduler\" version="
              loglevel: "notice"
