---
- name: "cilium"
  show_in_selector: false
  matchkeys:
    - pod_name: "cilium"
      container_name: "cilium-agent"
    - pod_name: "safe-agent-updater"
      container_name: "safe-agent-updater"
      container_type: "InitContainer"
    - pod_name: "cilium-operator"
      container_name: "cilium-operator"
    # This is a very poor match; let's hope that deckhouse doesn't have
    # other operators named equally vaguely.
    - pod_name: "operator"
      container_name: "operator"
      image_name: "/deckhouse/ce"
    - pod_name: "cilium"
      container_name: "mount-cgroup"
      container_type: "InitContainer"
    - pod_name: "cilium"
      container_name: "config"
      container_type: "InitContainer"
  parser_rules:
    - name: "key_value"
    - name: "custom_splitter"
      options:
        regex: '^\d{4}.\d\d.\d\d \d\d:\d\d:\d\d ([A-Z]+?) (.*)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              # We'll eventually have to fix this
              # if cilium changes major version
              matchkey: "Cilium 1"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "Cilium Operator 1"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "cilium-envoy  version:"
              loglevel: "notice"
- name: "cilium"
  show_in_selector: false
  matchkeys:
    - pod_name: "agent"
      container_name: "cni-migration-init-checker"
      container_type: "InitContainer"
      image_name: "/deckhouse/ce"
    - pod_name: "safe-agent"
      container_name: "check-wg-kernel-compat"
      container_type: "InitContainer"
      image_name: "/deckhouse/ce"
  parser_rules:
    - name: "json"
