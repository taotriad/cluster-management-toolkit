---
- name: "openshift-cluster-version"
  show_in_selector: false
  matchkeys:
    - pod_name: "cluster-version-operator"
      container_name: "cluster-version-operator"
  parser_rules:
    - name: "glog"
    - name: "expand_event"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "match"
            matchkey: "(Updating.*due to diff: )(.*)$"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "match"
            matchkey: '[A-Z]\d{4} \d\d:\d\d:\d\d'
            format_block_end: false
        formatter: "format_diff"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "ClusterVersionOperator "
              loglevel: "notice"
    - name: "key_value_with_leading_message"
