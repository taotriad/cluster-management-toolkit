---
- name: "harvester"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/harvester-cluster-repo"
  parser_rules:
    - name: "http"
- name: "harvester"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/harvester-eventrouter"
    - image_name: "/rancher/harvester-seeder"
  parser_rules:
    - name: "glog"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "regex"
              matchkey: "Starting harvester-eventrouter version"
              loglevel: "notice"
    - name: "json"
    - name: "key_value"
      options:
        severity:
          overrides:
            - matchtype: "regex"
              matchkey: ".*Starting .+ version"
              loglevel: "notice"
- name: "harvester"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/support-bundle-kit"
  parser_rules:
    - name: "glog"
    - name: "key_value"
- name: "harvester"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/harvester-load-balancer"
    - image_name: "/rancher/harvester:"
    - image_name: "/rancher/harvester-network-controller"
    - image_name: "/rancher/harvester-network-webhook"
    - image_name: "/rancher/harvester-networkfs-manager"
    - image_name: "/rancher/harvester-node-disk-manager"
    - image_name: "/rancher/harvester-node-manager"
    - image_name: "/rancher/harvester-pcidevices"
    - image_name: "/rancher/harvester-vm-import-controller"
    - image_name: "/rancher/harvester-webhook"
    - image_name: "/rancher/harvester-upgrade"
  parser_rules:
    - name: "strip_ansicodes"
    - name: "glog"
    - name: "key_value"
      options:
        newlines: "strip_trailing"
        severity:
          overrides:
            - matchtype: "regex"
              matchkey: ".*Starting .+ version"
              loglevel: "notice"
            - matchtype: "regex"
              matchkey: ".*manager .+ starting"
              loglevel: "notice"
            - matchtype: "regex"
              matchkey: ".*controller .+ starting"
              loglevel: "notice"
    - name: "yaml_line"
      options:
        block_start:
          # FIXME: The first rule isn't perfect
          - matchtype: "regex"
            matchkey: "Upgrade repo deployment is ready."
            matchline: "any"
            format_block_start: false
          - matchtype: "regex"
            matchkey: "The final content of .* patch file"
            matchline: "any"
            format_block_start: false
          - matchtype: "startswith"
            matchkey: "current valuesContent of the addon"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "regex"
            matchkey: "Upgrad|Patch"
            format_block_end: false
            process_block_end: false
          - matchtype: "regex"
            matchkey: "Upgrad|Patch"
            format_block_end: false
            process_block_end: false
          - matchtype: "regex"
            matchkey: "managedchart.+ configured"
            format_block_end: false
            process_block_end: false
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "no such image"
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "Fail to remove images"
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "error of removing image"
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "\"Warning: "
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "Error: "
              loglevel: "error"
