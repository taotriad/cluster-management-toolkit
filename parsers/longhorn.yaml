---
- name: "longhorn"
  show_in_selector: false
  matchkeys:
    - image_name: "/longhornio/longhorn-manager"
    - image_name: "/longhornio/longhorn-share-manager"
  parser_rules:
    - name: "glog"
    - name: "key_value"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "\"CSI Driver: driver.longhorn.io version:"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "\"Warning:"
              loglevel: "warning"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "CSI Driver: driver.longhorn.io version:"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "\"Warning:"
              loglevel: "warning"
    - name: "custom_splitter"
      options:
        regex: '^\d\d/\d\d/\d{4} \d\d:\d\d:\d\d : (.*)'
        message:
          field: 1
- name: "longhorn"
  show_in_selector: false
  matchkeys:
    - image_name: "/longhornio/longhorn-instance-manager"
  parser_rules:
    - name: "custom_splitter"
      options:
        regex: '^\[([^]]+)\] (.*)'
        facility:
          fields:
            - 1
        message:
          field: 2
    - name: "key_value"
- name: "longhorn"
  show_in_selector: false
  matchkeys:
    - image_name: "/longhornio/csi-node-driver-registrar"
    - image_name: "/longhornio/livenessprobe"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
- name: "longhorn"
  show_in_selector: false
  matchkeys:
    - image_name: "/longhornio/support-bundle-kit"
  parser_rules:
    - name: "glog"
    - name: "key_value"
