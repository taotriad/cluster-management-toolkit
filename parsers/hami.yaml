---
- name: "hami"
  show_in_selector: false
  matchkeys:
    - image_name: "/projecthami/hami"
  parser_rules:
    - name: "glog"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            matchkey: "Running with config:"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: "}"
            format_block_end: true
        formatter: "reformat_json"
    - name: "key_value_with_leading_message"
