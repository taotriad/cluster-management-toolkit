---
- name: "internal_error"
  show_in_selector: false
  matchkeys:
    - pod_name: "internal_error"
  parser_rules:
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        # yamllint disable-line rule:line-length
        regex: '^([A-Z]+?): (.+)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
