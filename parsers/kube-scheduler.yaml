---
- name: "kube-scheduler"
  show_in_selector: false
  matchkeys:
    - image_name: "/kube-scheduler"
    - image_name: "/google_containers/kube-scheduler"
    - container_name: "kube-scheduler"
      image_name: "/rancher/hardened-kubernetes"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
            - matchtype: "startswith"
              matchkey: "Version: v"
              loglevel: "notice"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "\"Using component config"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: " >"
        formatter: "format_yaml"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            # yamllint disable-line rule:line-length
            matchkey: "-------------------------Configuration File Contents Start Here----------------------"
            matchline: "any"
        block_end:
          - matchtype: "exact"
            # yamllint disable-line rule:line-length
            matchkey: "------------------------------------Configuration File Contents End Here---------------------------------"
          - matchtype: "empty"
        formatter: "format_yaml"
- name: "kube-scheduler"
  show_in_selector: false
  matchkeys:
    - pod_name: "openshift-kube-scheduler"
      container_name: "kube-scheduler"
  parser_rules:
    - name: "glog"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "match"
            matchkey: '(Updating.*annotation for.*diff:) (.*)$'
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "eof"
            matchkey: ''
            format_block_end: false
          - matchtype: "match"
            matchkey: '[A-Z]\d{4} \d\d:\d\d:\d\d'
            format_block_end: false
        formatter: "format_diff"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "\"Using component config"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: " >"
        formatter: "format_yaml"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            # yamllint disable-line rule:line-length
            matchkey: "-------------------------Configuration File Contents Start Here----------------------"
            matchline: "any"
        block_end:
          - matchtype: "exact"
            # yamllint disable-line rule:line-length
            matchkey: "------------------------------------Configuration File Contents End Here---------------------------------"
          - matchtype: "empty"
        formatter: "format_yaml"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            matchkey: "Using component config:"
            matchline: "any"
        block_end:
          - matchtype: "empty"
        formatter: "format_yaml"
    - name: "expand_event"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
            - matchtype: "startswith"
              matchkey: "Version: v"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "Starting Kubernetes Scheduler version"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "cert-recovery-controller version"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "openshift-cluster-kube-scheduler-operator version"
              loglevel: "notice"
