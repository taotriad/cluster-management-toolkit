---
- name: "rke2-snapshot"
  show_in_selector: false
  matchkeys:
    - pod_name: "rke2-snapshot"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Version"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
