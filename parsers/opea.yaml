---
- name: "opea"
  show_in_selector: false
  matchkeys:
    - pod_name: "chatqna"
      container_name: "chatqna"
  parser_rules:
    - name: "custom_splitter"
      options:
        regex: '^([A-Z]{4}): (.*)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "ERROR:"
              loglevel: "error"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "Traceback (most recent call last):"
            matchline: "any"
            format_block_start: true
          - matchtype: "startswith"
            # yamllint disable-line rule:line-length
            matchkey: "During handling of the above exception, another exception occurred:"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "match"
            # yamllint disable-line rule:line-length
            matchkey: '(\S+?Error|\S+?Exception|GeneratorExit|KeyboardInterrupt|Stop.*?Iteration|SystemExit|socket.gaierror|UserWarning|SyntaxWarning): '
            format_block_end: true
        formatter: "format_python_traceback"
- name: "opea"
  show_in_selector: false
  matchkeys:
    - pod_name: "opea-"
  parser_rules:
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        regex: '^([A-Z]{4}): (.*)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
