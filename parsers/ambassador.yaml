---
- name: "ambassador"
  show_in_selector: false
  matchkeys:
    - pod_name: "ambassador"
  parser_rules:
    - name: "json"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Operator Version: "
              loglevel: "notice"
