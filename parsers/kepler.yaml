---
- name: "kepler"
  show_in_selector: false
  matchkeys:
    - pod_name: "kepler"
  parser_rules:
    - name: "glog"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "modprobe: FATAL: "
              loglevel: "error"
