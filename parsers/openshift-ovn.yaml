---
- name: "openshift-ovnkube"
  show_in_selector: false
  matchkeys:
    - pod_name: "ovnkube"
      container_name: "ovnkube-controller"
    - pod_name: "ovnkube"
      container_name: "ovnkube-cluster-manager"
    - pod_name: "ovnkube"
      container_name: "ovnkube-master"
    - pod_name: "ovnkube"
      container_name: "ovs-metrics-exporter"
    - pod_name: "ovnkube"
      container_name: "ovs-metrics-exporter"
    - pod_name: "ovnkube"
      container_name: "ovnkube-identity"
  parser_rules:
    - name: "glog"
    - name: "expand_event"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "================== ovnkube.sh --- version: "
              loglevel: "notice"
- name: "openshift-ovnkube"
  show_in_selector: false
  matchkeys:
    - pod_name: "ovnkube"
      container_name: "ovn-controller"
    - pod_name: "ovnkube"
      container_name: "northd"
    - pod_name: "ovnkube"
      container_name: "ovn-northd"
    - pod_name: "ovnkube"
      container_name: "nbdb"
    - pod_name: "ovnkube"
      container_name: "nb-ovsdb"
    - pod_name: "ovnkube"
      container_name: "sbdb"
    - pod_name: "ovnkube"
      container_name: "sb-ovsdb"
    - pod_name: "ovs-node"
      container_name: "ovs-daemons"
  parser_rules:
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        regex: '^\|\d+\|([^\|]+)\|([A-Z]+)\|(.*)'
        facility:
          fields:
            - 1
        severity:
          field: 2
          transform: "4letter"
        message:
          field: 3
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "================== ovnkube.sh --- version: "
              loglevel: "notice"
