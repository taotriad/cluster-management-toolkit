---
- name: "kruise"
  show_in_selector: false
  matchkeys:
    - pod_name: "kruise-daemon"
  parser_rules:
    - name: "glog"
- name: "kruise"
  matchkeys:
    - image_name: "/openkruise/agent-sandbox-controller"
    - image_name: "/openkruise/kruise-game-manager"
    - image_name: "/openkruise/kruise-manager"
    - image_name: "/openkruise/kruise-rollout"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
    - name: "tab_separated"
