---
- name: "kubevirt"
  show_in_selector: false
  matchkeys:
    - image_name: "/kubevirt/virt-api"
    - image_name: "/kubevirt/virt-controller"
    - image_name: "/kubevirt/virt-exportproxy"
    - image_name: "/kubevirt/virt-handler"
    - image_name: "/kubevirt/virt-launcher"
    - image_name: "/kubevirt/virt-operator"
    - image_name: "/kubevirt/virt-template-controller"
    - image_regex: ".*virt-api"
      container_name: "virt-api"
    - image_regex: ".*virt-controller"
      container_name: "virt-controller"
    - image_regex: ".*virt-handler"
      container_name: "virt-handler"
    - image_regex: ".*virt-operator"
      container_name: "virt-operator"
  parser_rules:
    - name: "ts_8601"
    - name: "glog"
    - name: "strip_ansicodes"
    - name: "json"
      options:
        facility:
          keys:
            - "pos"
    - name: "custom_splitter"
      options:
        regex: '^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d\.\d+[+-]\d{4}: (.*)'
        message:
          field: 1
    - name: "custom_splitter"
      options:
        regex: '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d+Z (.*)'
        message:
          field: 1
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Connecting to libvirt daemon failed: virError"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "http: TLS handshake error"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "http: \"TLS\" handshake error"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
            - matchtype: "startswith"
              matchkey: "panic:"
              loglevel: "alert"
            - matchtype: "startswith"
              matchkey: "qemu-kvm: warning:"
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "\"Warning: "
              loglevel: "warning"
            - matchtype: "startswith"
              matchkey: "libvirt version:"
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "starting up libvirt version:"
              loglevel: "notice"
- name: "kubevirt"
  show_in_selector: false
  matchkeys:
    - image_name: "/kubevirt/virt-template-apiserver"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
