---
- name: "kubesphere"
  show_in_selector: false
  matchkeys:
    - pod_name: "ks-installer"
      container_name: "installer"
  parser_rules:
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        regex: '^\[?(INFO|WARNING)\]? *?: (.*)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "match"
            matchkey: 'PLAY \[.*\*\*\*$'
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "eof"
            matchkey: ""
            format_block_end: false
        formatter: "format_ansible"
