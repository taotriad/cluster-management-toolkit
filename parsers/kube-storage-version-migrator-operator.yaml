---
- name: "kube-storage-version-migrator-operator"
  show_in_selector: false
  matchkeys:
    - pod_name: "kube-storage-version-migrator"
      container_name: "kube-storage-version-migrator"
  parser_rules:
    - name: "glog"
    - name: "expand_event"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              # yamllint disable-line rule:line-length
              matchkey: "openshift-kube-storage-version-migrator-operator version"
              loglevel: "notice"
    - name: "key_value_with_leading_message"
