---
- name: "cdi"
  show_in_selector: false
  matchkeys:
    - image_regex: "/cdi-apiserver"
    - image_regex: "/cdi-controller"
    - image_regex: "/cdi-deployment"
    - image_regex: "/cdi-operator"
    - image_regex: "/cdi-importer"
    - image_regex: "/cdi-uploadproxy"
  parser_rules:
    - name: "ts_8601"
    - name: "glog"
    - name: "json"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "http: TLS handshake error"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "http: \"TLS\" handshake error"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
