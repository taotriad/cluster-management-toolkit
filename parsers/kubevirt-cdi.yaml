---
- name: "kubevirt-cdi"
  show_in_selector: false
  matchkeys:
    - pod_name: "cdi-apiserver"
    - pod_name: "cdi-deployment"
    - pod_name: "cdi-operator"
    # This quite clearly indicates that we have need for regex-patching.
    - image_name: "/suse/sles/15.7/cdi-importer"
    - image_name: "/suse/sles/16.0/cdi-importer"
  parser_rules:
    - name: "ts_8601"
    - name: "glog"
    - name: "json"
    - name: "key_value_with_leading_message"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "http: TLS handshake error"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "http: \"TLS\" handshake error"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "Trace["
              loglevel: "debug"
- name: "kubevirt-cdi"
  show_in_selector: false
  matchkeys:
    - pod_name: "cdi-uploadproxy"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
