---
- name: "rancher"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/rancher-webhook"
  parser_rules:
    - name: "key_value"
    - name: "ts_8601"
    - name: "glog"
    - name: "override_severity"
      overrides:
        - matchtype: "startswith"
          matchkey: "Rancher-webhook version"
          loglevel: "notice"
- name: "rancher"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/rancher"
  parser_rules:
    - name: "ts_8601"
    - name: "bracketed_severity"
    - name: "glog"
    - name: "custom_splitter"
      options:
        regex: '^\d{4}/\d\d/\d\d \d\d:\d\d:\d\d (.*)'
        message:
          field: 1
    - name: "override_severity"
      overrides:
        - matchtype: "startswith"
          matchkey: "Rancher version "
          loglevel: "notice"
        - matchtype: "startswith"
          matchkey: "Error from server "
          loglevel: "error"
        - matchtype: "startswith"
          matchkey: "\"Warning"
          loglevel: "warning"
- name: "rancher"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/fleet-controller"
  parser_rules:
    - name: "json"
- name: "rancher"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/fleet"
      container_name: "fleet-cleanup"
    - image_name: "/rancher/fleet"
      container_name: "fleet-agentmanagement"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
- name: "rancher"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/fleet"
      container_name: "gitjob"
  parser_rules:
    - name: "glog"
    - name: "json"
    - name: "key_value_with_leading_message"
- name: "rancher"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/fleet-agent"
    - image_name: "/rancher/fleet-agent"
      container_type: "InitContainer"
  parser_rules:
    - name: "glog"
    - name: "json"
    - name: "key_value"
- name: "rancher"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/fleet"
  parser_rules:
    - name: "glog"
    - name: "json"
    - name: "key_value"
