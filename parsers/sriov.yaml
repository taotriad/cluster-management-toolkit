---
- name: "sriov"
  show_in_selector: false
  matchkeys:
    - image_name: "/k8snetworkplumbingwg/sriov-network-device-plugin"
  parser_rules:
    - name: "glog"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "match"
            matchkey: "(raw ResourceList: )({)$"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: "}"
            format_block_end: true
        formatter: "reformat_json"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "WARNING"
              loglevel: "warning"
