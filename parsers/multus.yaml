---
- name: "multus"
  show_in_selector: false
  matchkeys:
    - pod_name: "kube-multus-ds"
      container_name: "kube-multus"
  parser_rules:
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        regex: '^(\[verbose\] )?(.*)'
        message:
          field: 2
    - name: "custom_splitter"
      options:
        regex: '^\[(debug)\] (.*)'
        severity:
          field: 1
          transform: "str"
        message:
          field: 2
    - name: "json_with_leading_message"
- name: "multus"
  show_in_selector: false
  matchkeys:
    - pod_name: "kube-multus-ds"
      container_name: "generate-kubeconfig"
      container_type: "InitContainer"
  parser_rules:
    - name: "custom_splitter"
      options:
        regex: '^\d{4}/\d\d/\d\d\s\d\d:\d\d:\d\d\s(INFO):\s(.*)'
        severity:
          field: 2
          transform: "4letter"
        message:
          field: 2
    - name: "yaml_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "# Kubeconfig file for "
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "empty"
- name: "multus"
  show_in_selector: false
  matchkeys:
    - image_name: "/rancher/hardened-multus-cni"
  parser_rules:
    - name: "ts_8601"
- name: "multus"
  show_in_selector: false
  matchkeys:
    - pod_name: "multus"
      container_name: "kube-multus"
    - pod_name: "multus-additional-cni-plugins"
    - pod_name: "multus-additional-cni-plugins"
      container_type: "InitContainer"
    - image_name: "/rancher/hardened-cni-plugins"
      container_type: "InitContainer"
  parser_rules:
    - name: "ts_8601"
    - name: "override_severity"
      overrides:
        - matchtype: "startswith"
          matchkey: "[verbose]"
          loglevel: "debug"
    - name: "custom_splitter"
      options:
        regex: '^(\[verbose\] )?(.*)'
        message:
          field: 2
    - name: "glog"
    - name: "json"
      options:
        versions:
          - "cniVersion"
    - name: "expand_event"
    - name: "custom_splitter"
      options:
        regex: '^\[(cnibincopy)\]\s(.*)'
        facility:
          fields:
            - 1
        message:
          field: 2
    - name: "override_severity"
      overrides:
        - matchtype: "startswith"
          matchkey: "WARN: "
          loglevel: "warning"
        - matchtype: "endswith"
          matchkey: "Text file busy"
          loglevel: "warning"
        - matchtype: "contains"
          matchkey: "exit_with_error"
          loglevel: "error"
    - name: "key_value_with_leading_message"
- name: "multus"
  show_in_selector: false
  matchkeys:
    - pod_name: "multus-admission-controller"
      container_name: "multus-admission-controller"
    - pod_name: "network-metrics-daemon"
      container_name: "network-metrics-daemon"
      image_name: "/openshift"
  parser_rules:
    - name: "ts_8601"
    - name: "glog"
    - name: "override_severity"
      overrides:
        - matchtype: "startswith"
          matchkey: "http: \"TLS\" handshake error"
          loglevel: "error"
        - matchtype: "startswith"
          matchkey: "http: TLS handshake error"
          loglevel: "error"
        - matchtype: "startswith"
          matchkey: "Version:"
          loglevel: "notice"
        - matchtype: "startswith"
          matchkey: "Trace["
          loglevel: "debug"
