---
- name: "nvidia"
  show_in_selector: false
  matchkeys:
    - image_name: "/nvidia/k8s-device-plugin"
    - image_name: "/nvidia/cloud-native/k8s-driver-manager"
      container_type: "InitContainer"
  parser_rules:
    - name: "ts_8601"
    - name: "glog"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            matchkey: "Running with config:"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "exact"
            matchkey: "}"
            format_block_end: true
        formatter: "format_json"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "WARNING: "
              loglevel: "warning"
    - name: "key_value"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "\"Using driver version"
              loglevel: "notice"
- name: "nvidia"
  show_in_selector: false
  matchkeys:
    - image_name: "/nvidia/k8s/container-toolkit"
    - image_name: "/nvidia/k8s/dcgm-exporter"
    - image_name: "/nvidia/cloud-native/gpu-operator-validator"
      container_type: "InitContainer"
  parser_rules:
    - name: "glog"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "version: "
              loglevel: "notice"
            - matchtype: "startswith"
              matchkey: "NVIDIA-SMI has failed"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "CRITICAL:"
              loglevel: "critical"
            - matchtype: "startswith"
              matchkey: "Error:"
              loglevel: "error"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            matchkey: "Using config:"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "startswith"
            matchkey: "time"
            format_block_end: false
            process_block_end: false
        severity:
          default: "info"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "+---------------"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "regex"
            matchkey: "^(?![+|]|^$)"
            format_block_end: false
            process_block_end: false
        severity:
          default: "info"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "****************"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "endswith"
            matchkey: "****************"
            format_block_end: true
            process_block_end: true
        severity:
          default: "info"
    - name: "key_value_with_leading_message"
      options:
        version:
          keys:
            - "Version"
- name: "nvidia"
  show_in_selector: false
  matchkeys:
    - image_name: "/nvidia/dra-driver-nvidia-gpu"
  parser_rules:
    - name: "glog"
    - name: "key_value_with_leading_message"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "exact"
            matchkey: "Flags: (*main.Flags)({"
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "exact"
            matchkey: "})"
            format_block_end: true
            process_block_end: true
        severity:
          default: "info"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Commit: "
              loglevel: "notice"
