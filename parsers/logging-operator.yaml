---
- name: "logging-operator"
  show_in_selector: false
  matchkeys:
    - image_name: "/kube-logging/logging-operator"
  parser_rules:
    - name: "json"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "WARNING"
              loglevel: "warning"
- name: "logging-operator"
  show_in_selector: false
  matchkeys:
    - image_name: "/opstree/logging-operator"
  parser_rules:
    - name: "glog"
    - name: "tab_separated"
