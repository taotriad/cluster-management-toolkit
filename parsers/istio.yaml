---
- name: "istio"
  show_in_selector: false
  matchkeys:
    - image_name: "/release/install-cni"
      pod_name: "istio-cni"
  parser_rules:
    - name: "tab_separated"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "search"
            matchkey: 'CNI install configuration:'
            matchline: "any"
            format_block_start: false
          - matchtype: "search"
            matchkey: 'CNI race repair configuration:'
            matchline: "any"
            format_block_start: false
          - matchtype: "search"
            matchkey: 'wrote kubeconfig file .+ with:'
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "match"
            matchkey: '\d\d\d\d-\d\d-\d\d'
            format_block_end: false
            process_block_end: false
        formatter: "format_yaml"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "CNI version: "
              loglevel: "notice"
- name: "istio"
  show_in_selector: false
  matchkeys:
    - image_name: "/istio/proxyv2"
      container_type: "InitContainer"
    - image_name: "/release/proxyv2"
      container_type: "InitContainer"
    - image_name: "/istio-release/proxyv2"
      container_type: "InitContainer"
  parser_rules:
    - name: "tab_separated"
    - name: "ts_8601"
    - name: "custom_splitter"
      options:
        regex: '^\[\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d.\d{3}Z\] (.*)'
        message:
          field: 1
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "Apply mesh config from file"
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "match"
            matchkey: '\d\d\d\d-\d\d-\d\d'
            format_block_end: false
            process_block_end: false
        formatter: "format_yaml"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "startswith"
            matchkey: "Effective config: "
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "match"
            matchkey: '\d\d\d\d-\d\d-\d\d'
            format_block_end: false
            process_block_end: false
        formatter: "format_yaml"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "Version "
              loglevel: "notice"
    - name: "key_value_with_leading_message"
- name: "istio"
  show_in_selector: false
  matchkeys:
    - image_name: "/istio/proxyv2"
  parser_rules:
    - name: "tab_separated"
- name: "istio"
  show_in_selector: false
  matchkeys:
    - pod_name: "istiod"
      container_name: "discovery"
  parser_rules:
    - name: "tab_separated"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "match"
            matchkey: '(mesh configuration: )(.*)'
            matchline: "any"
            format_block_start: false
          - matchtype: "match"
            matchkey: '(flags: )(.*)'
            matchline: "any"
            format_block_start: false
          - matchtype: "match"
            matchkey: '(Push Status: )({)'
            matchline: "any"
            format_block_start: false
        block_end:
          - matchtype: "match"
            matchkey: '\d\d\d\d-\d\d-\d\d'
            format_block_end: false
            process_block_end: false
        formatter: "format_yaml"
    - name: "custom_line"
      options:
        block_start:
          - matchtype: "match"
            matchkey: '(.*)\s*(-----BEGIN CERTIFICATE-----)'
            matchline: "any"
            format_block_start: true
        block_end:
          - matchtype: "contains"
            matchkey: '-----END CERTIFICATE-----'
            format_block_end: true
            process_block_end: true
        formatter: "format_crt"
    # We're using the timestamps to detect block ends for YAML,
    # so we cannot move this earlier.
    - name: "ts_8601"
    - name: "override_severity"
      options:
        severity:
          overrides:
            - matchtype: "startswith"
              matchkey: "http: \"TLS\" handshake error"
              loglevel: "error"
            - matchtype: "startswith"
              matchkey: "version: "
              loglevel: "notice"
    - name: "key_value_with_leading_message"
